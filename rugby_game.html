// Seeded random for consistent player generation
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (s >>> 0) / 0xFFFFFFFF;
  };
}

function genPlayer(teamQuality, posIdx, rand) {
  rand = rand || Math.random.bind(Math);
  const variance = Math.floor(rand() * 8) - 4;
  const posBonus = [0,-1,0,1,1,2,2,1,3,3,2,2,2,2,2][posIdx] || 0;
  const r = Math.max(50, Math.min(97, teamQuality + variance + posBonus));
  const fn = FIRST_NAMES[Math.floor(rand() * FIRST_NAMES.length)];
  const ln = LAST_NAMES[Math.floor(rand() * LAST_NAMES.length)];
  return { n: fn[0] + '. ' + ln, r };
}

function genPlayers(seed, baseRating) {
  const rand = seededRand(seed.split('').reduce((a,c) => a + c.charCodeAt(0), 0));
  const arr = [];
  for (let i = 0; i < 24; i++) arr.push(genPlayer(baseRating, i % 15, rand));
  return arr;
}

// ============================================================
// FIELD CONSTANTS
// ============================================================
const SCALE = 8.0; // px per meter
const FX = 150, FY = 75; // field origin (top-left of in-goal zone)
const FW = 120 * SCALE; // 960px total length
const FH = 70 * SCALE;  // 560px total height
// Key X positions in pixels
const X_TRY_L  = FX + 10 * SCALE;   // left try line
const X_TRY_R  = FX + 110 * SCALE;  // right try line
const X_22L    = FX + 32 * SCALE;   // left 22m
const X_22R    = FX + 88 * SCALE;   // right 22m
const X_10L    = FX + 50 * SCALE;   // left 10m line
const X_10R    = FX + 70 * SCALE;   // right 10m line
const X_MID    = FX + 60 * SCALE;   // halfway
const Y_MID    = FY + 35 * SCALE;   // vertical center

function mToX(m) { return FX + m * SCALE; }
function mToY(m) { return FY + m * SCALE; }
function xToM(px) { return (px - FX) / SCALE; }
function yToM(py) { return (py - FY) / SCALE; }
function inField(px, py) { return px >= FX && px <= FX+FW && py >= FY && py <= FY+FH; }
function inPlay(px) { return px >= X_TRY_L && px <= X_TRY_R; }

// ============================================================
// GAUGE SYSTEM
// ============================================================
function gaugeColor(r) {
  if (r < 0.25) return '#FF8C00';
  if (r < 0.60) return '#FFD700';
  if (r < 0.85) return '#00CC44';
  return '#FF3322';
}
function gaugeName(r) {
  if (r < 0.25) return 'orange';
  if (r < 0.60) return 'jaune';
  if (r < 0.85) return 'vert';
  return 'rouge';
}
function drawGauge(x, y, w, h, ratio, label) {
  ctx.fillStyle = '#222';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = gaugeColor(ratio);
  ctx.fillRect(x, y, w * ratio, h);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  if (label) {
    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.fillText(label, x, y - 2);
  }
}

// INPUT - GAMEPAD API
// ============================================================
const INPUT = {
  gp: null,
  prev: {},
  curr: {},
  axes: [0,0,0,0],
  // Button indices for Xbox controller
  A:0, B:1, X:2, Y:3, LB:4, RB:5, LT:6, RT:7,
  SEL:8, START:9,
  DUP:12, DDOWN:13, DLEFT:14, DRIGHT:15,

  poll() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    this.gp = null;
    for (let g of gps) { if (g) { this.gp = g; break; } }
    if (!this.gp) return;
    this.prev = {...this.curr};
    this.curr = {};
    for (let i = 0; i < this.gp.buttons.length; i++) {
      this.curr[i] = this.gp.buttons[i].pressed || this.gp.buttons[i].value > 0.5;
    }
    this.axes = [...this.gp.axes];
    // Handle LT/RT as axes if needed
    if (this.gp.buttons[6]) this.ltVal = this.gp.buttons[6].value;
    if (this.gp.buttons[7]) this.rtVal = this.gp.buttons[7].value;
  },
  pressed(btn) { return this.curr[btn] && !this.prev[btn]; },
  held(btn)    { return !!this.curr[btn]; },
  released(btn){ return !this.curr[btn] && !!this.prev[btn]; },
  lx() { return Math.abs(this.axes[0]||0) > 0.15 ? (this.axes[0]||0) : 0; },
  ly() { return Math.abs(this.axes[1]||0) > 0.15 ? (this.axes[1]||0) : 0; },
  rx() { return Math.abs(this.axes[2]||0) > 0.15 ? (this.axes[2]||0) : 0; },
  ry() { return Math.abs(this.axes[3]||0) > 0.15 ? (this.axes[3]||0) : 0; },

  // Keyboard fallback
  kb: {},
  connected: false,
};

// Keyboard fallback for testing
window.addEventListener('keydown', e => { INPUT.kb[e.code] = true; });
window.addEventListener('keyup',   e => { INPUT.kb[e.code] = false; });
window.addEventListener('gamepadconnected',    e => { INPUT.connected = true; console.log('Gamepad:', e.gamepad.id); });
window.addEventListener('gamepaddisconnected', e => { INPUT.connected = false; });

function kbAxis() {
  // Keyboard WASD for left stick
  let x = 0, y = 0;
  if (INPUT.kb['ArrowLeft']  || INPUT.kb['KeyA']) x = -1;
  if (INPUT.kb['ArrowRight'] || INPUT.kb['KeyD']) x = 1;
  if (INPUT.kb['ArrowUp']    || INPUT.kb['KeyW']) y = -1;
  if (INPUT.kb['ArrowDown']  || INPUT.kb['KeyS']) y = 1;
  return {x, y};
}
function kbRAxis() {
  let x = 0, y = 0;
  if (INPUT.kb['KeyJ']) x = -1;
  if (INPUT.kb['KeyL']) x = 1;
  if (INPUT.kb['KeyI']) y = -1;
  if (INPUT.kb['KeyK']) y = 1;
  return {x, y};
}
function getLX() { return INPUT.gp ? INPUT.lx() : kbAxis().x; }
function getLY() { return INPUT.gp ? INPUT.ly() : kbAxis().y; }
function getRX() { return INPUT.gp ? INPUT.rx() : kbRAxis().x; }
function getRY() { return INPUT.gp ? INPUT.ry() : kbRAxis().y; }
function btnA()  { return INPUT.gp ? INPUT.held(INPUT.A) : INPUT.kb['Enter'] || INPUT.kb['KeyZ']; }
function btnB()  { return INPUT.gp ? INPUT.held(INPUT.B) : INPUT.kb['Backspace'] || INPUT.kb['KeyX']; }
function btnX()  { return INPUT.gp ? INPUT.held(INPUT.X) : INPUT.kb['KeyC']; }
function btnY()  { return INPUT.gp ? INPUT.held(INPUT.Y) : INPUT.kb['KeyV']; }
function btnAP() { return INPUT.gp ? INPUT.pressed(INPUT.A) : (INPUT.kb['Enter'] && !INPUT._prevKb?.['Enter']); }
function btnBP() { return INPUT.gp ? INPUT.pressed(INPUT.B) : false; }
function btnXP() { return INPUT.gp ? INPUT.pressed(INPUT.X) : false; }
function btnYP() { return INPUT.gp ? INPUT.pressed(INPUT.Y) : false; }
function btnStart() { return INPUT.gp ? INPUT.pressed(INPUT.START) : INPUT.kb['Escape']; }
function btnSel()   { return INPUT.gp ? INPUT.pressed(INPUT.SEL) : INPUT.kb['Tab']; }
function btnLT()    { return INPUT.gp ? INPUT.held(INPUT.LT) : INPUT.kb['ShiftLeft']; }
function btnRT()    { return INPUT.gp ? INPUT.held(INPUT.RT) : INPUT.kb['Space']; }
function btnRTp()   { return INPUT.gp ? INPUT.pressed(INPUT.RT) : (INPUT.kb['Space'] && !INPUT._prevKb?.['Space']); }
function dUp()   { return INPUT.gp ? INPUT.pressed(INPUT.DUP)    : (INPUT.kb['Numpad8'] && !INPUT._prevKb?.['Numpad8']); }
function dDown() { return INPUT.gp ? INPUT.pressed(INPUT.DDOWN)  : (INPUT.kb['Numpad2'] && !INPUT._prevKb?.['Numpad2']); }
function dLeft() { return INPUT.gp ? INPUT.pressed(INPUT.DLEFT)  : (INPUT.kb['Numpad4'] && !INPUT._prevKb?.['Numpad4']); }
function dRight(){ return INPUT.gp ? INPUT.pressed(INPUT.DRIGHT) : (INPUT.kb['Numpad6'] && !INPUT._prevKb?.['Numpad6']); }

// ============================================================
// BALL CLASS
// ============================================================
class Ball {
  constructor() { this.reset(); }
  reset(x = X_MID, y = Y_MID) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.vz = 0; this.z = 0;    // height
    this.onGround = true;
    this.carrier = null;
    this.team = -1;             // which team has it
    this.loose = false;
    this.inTouch = false;
    this.touchX = 0; this.touchY = 0;
    this.kickType = null;       // 'grubber','clearance','drop','upunder'
    this.spinning = 0;
    this.shadowAlpha = 0.3;
  }
  update(dt) {
    if (this.carrier) {
      this.x = this.carrier.x;
      this.y = this.carrier.y;
      this.z = 0; this.vz = 0;
      this.onGround = true;
      return;
    }
    const gravity = 9.8 * SCALE * 3; // visual gravity
    const friction = 0.88;
    if (!this.onGround) {
      this.vz -= gravity * dt;
      this.z += this.vz * dt;
      if (this.z <= 0) {
        this.z = 0;
        // rugby oval bounce - unpredictable
        const bounceY = 0.45 + Math.random() * 0.2;
        this.vz = Math.abs(this.vz) * bounceY;
        // lateral wobble on bounce
        const wobble = (Math.random() - 0.5) * 50;
        const wob2 = (Math.random() - 0.5) * 50;
        if (this.vz < 30) { this.vz = 0; this.onGround = true; }
        if (this.kickType !== 'grubber') {
          this.vx += wobble;
          this.vy += wob2;
        }
      }
    } else {
      // Rolling friction
      this.vx *= Math.pow(friction, dt * 60);
      this.vy *= Math.pow(friction, dt * 60);
      if (Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5) {
        this.vx = 0; this.vy = 0;
      }
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.spinning += 8 * dt;

    // Touch detection
    if (this.x < FX || this.x > FX + FW || this.y < FY || this.y > FY + FH) {
      if (!this.inTouch) {
        this.inTouch = true;
        this.touchX = this.x;
        this.touchY = Math.max(FY, Math.min(FY + FH, this.y));
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.x = Math.max(FX, Math.min(FX + FW, this.x));
        this.y = Math.max(FY, Math.min(FY + FH, this.y));
      }
    }
    // Dead ball
    if (this.x < FX - 20 || this.x > FX + FW + 20) {
      this.inTouch = true;
      this.vx = 0; this.vy = 0;
    }
  }
  kick(vx, vy, vz, type) {
    this.carrier = null;
    this.loose = true;
    this.inTouch = false;
    this.vx = vx; this.vy = vy; this.vz = vz;
    this.z = 0; this.onGround = false;
    this.kickType = type;
    this.team = -1;
  }
  draw() {
    const bx = this.x, by = this.y - this.z * 0.5;
    // Shadow
    if (this.z > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 0.4 - this.z / 400);
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, 9, 5, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    // Ball
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(this.spinning * 0.1);
    ctx.fillStyle = '#c8860a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 6.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#f5d5a0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-9, 0); ctx.lineTo(9, 0);
    ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 6.5, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

// PLAYER CLASS
// ============================================================
class Player {
  constructor(teamIdx, shirtNum, posIdx, x, y, name, rating) {
    this.teamIdx = teamIdx;  // 0 = player team, 1 = CPU
    this.shirtNum = shirtNum;
    this.posIdx = posIdx;
    this.x = x; this.y = y;
    this.name = name;
    this.rating = rating;
    this.profile = PROFILES[posIdx];
    this.vx = 0; this.vy = 0;
    this.speed = 0;
    this.dir = teamIdx === 0 ? 0 : Math.PI; // facing direction
    this.hasBall = false;
    this.tackling = false;
    this.tackled = false;
    this.inRuck = false;
    this.stamina = 1.0;
    this.sprint = 1.0;
    this.isSprinting = false;
    this.chargeGauge = 0;
    this.tackleGauge = 0;
    this.passGauge = 0;
    this.isCharging = false;
    this.isTackling = false;
    this.tackleType = null;
    this.stunTime = 0;       // time stunned/on ground after tackle
    this.lastAction = 0;
    this.injured = false;
    this.yellowCard = false;
    this.yellowTime = 0;
    this.onGround = false;
    this.groundTime = 0;
    this.isSelected = false;
    this.targetX = x; this.targetY = y;
    this.aiState = 'idle';
    this.controlRadius = this.profile.r * 3; // for auto-control switch
    this.staminaRecovery = 0;
    this.sprintRecovery = 0;
    // double-tap tracking
    this.lastBtnTime = {};
    this.rtCount = 0;
    this.rtLastTime = 0;
  }

  maxSpeed() {
    const base = this.profile.spd * SCALE; // convert m/s to px/s
    const staminaMult = 0.6 + 0.4 * this.stamina;
    const sprintMult = this.isSprinting && this.sprint > 0 ? 1.3 : 1.0;
    return base * staminaMult * sprintMult;
  }

  update(dt) {
    if (this.stunTime > 0) {
      this.stunTime -= dt;
      this.vx *= 0.85;
      this.vy *= 0.85;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      return;
    }
    if (this.onGround) {
      this.groundTime -= dt;
      if (this.groundTime <= 0) {
        this.onGround = false;
        this.inRuck = false;
      }
      return;
    }
    // Stamina drain
    if (this.isSprinting && this.sprint > 0) {
      this.sprint -= dt * 0.04;
      this.stamina -= dt * 0.003;
    } else {
      this.sprint = Math.min(1, this.sprint + dt * 0.08);
    }
    this.stamina = Math.min(1, this.stamina + dt * 0.001);

    // Movement
    const spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    this.speed = spd;
    if (spd > 0) {
      this.dir = Math.atan2(this.vy, this.vx);
    }

    // Friction
    const friction = 0.82;
    this.vx *= Math.pow(friction, dt * 60);
    this.vy *= Math.pow(friction, dt * 60);

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Clamp to field
    this.x = Math.max(FX - 10, Math.min(FX + FW + 10, this.x));
    this.y = Math.max(FY, Math.min(FY + FH, this.y));

    // Yellow card countdown
    if (this.yellowCard) {
      this.yellowTime -= dt;
      if (this.yellowTime <= 0) this.yellowCard = false;
    }
  }

  move(dx, dy) {
    if (this.onGround || this.stunTime > 0) return;
    const mag = Math.sqrt(dx*dx + dy*dy);
    if (mag < 0.01) return;
    const nx = dx/mag, ny = dy/mag;
    const spd = this.maxSpeed();
    const accel = 600;
    this.vx += nx * accel * (1/60);
    this.vy += ny * accel * (1/60);
    const curSpd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if (curSpd > spd) {
      this.vx = this.vx/curSpd * spd;
      this.vy = this.vy/curSpd * spd;
    }
  }

  dist(other) {
    const dx = this.x - other.x, dy = this.y - other.y;
    return Math.sqrt(dx*dx + dy*dy);
  }
  distPt(x, y) {
    const dx = this.x - x, dy = this.y - y;
    return Math.sqrt(dx*dx + dy*dy);
  }

  draw(teamColor, border1, border2, jerseyStyle) {
    const r = this.profile.r;
    ctx.save();
    ctx.translate(this.x, this.y);

    // Stun flash
    if (this.onGround) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() * 0.01));
    }

    // Jersey - circle with team colors
    this.drawJersey(r, teamColor, border1, border2, jerseyStyle);

    // Number
    ctx.fillStyle = this.getNumColor(teamColor);
    ctx.font = `bold ${r > 9 ? 9 : 8}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.shirtNum, 0, 0);

    // Ball indicator
    if (this.hasBall) {
      ctx.fillStyle = '#c8860a';
      ctx.beginPath();
      ctx.ellipse(r + 2, -3, 5, 3, -0.3, 0, Math.PI*2);
      ctx.fill();
    }

    // Selection indicator
    if (this.isSelected) {
      ctx.strokeStyle = '#00FFFF';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 2]);
      ctx.beginPath();
      ctx.arc(0, 0, r + 4, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Stamina bar
    ctx.fillStyle = '#333';
    ctx.fillRect(-r, r + 2, r*2, 2);
    ctx.fillStyle = this.stamina > 0.5 ? '#44ff44' : this.stamina > 0.25 ? '#ffaa00' : '#ff3300';
    ctx.fillRect(-r, r + 2, r*2 * this.stamina, 2);

    // Yellow card indicator
    if (this.yellowCard) {
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(r - 4, -r, 4, 6);
    }

    ctx.restore();
  }

  drawJersey(r, c1, c2, c3, style) {
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    if (style === 'hstripes') {
      // Horizontal stripes
      ctx.fillStyle = c1;
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = c2;
      for (let i = -r; i < r; i += 5) {
        if (Math.floor((i + r) / 5) % 2 === 0) {
          ctx.fillRect(-r, i, r*2, 5);
        }
      }
    } else if (style === 'vstripes') {
      ctx.fillStyle = c1;
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = c2;
      for (let i = -r; i < r; i += 5) {
        if (Math.floor((i + r) / 5) % 2 === 0) {
          ctx.fillRect(i, -r, 5, r*2);
        }
      }
    } else if (style === 'checker') {
      ctx.fillStyle = c1;
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = c2;
      for (let ix = -r; ix < r; ix += 6) {
        for (let iy = -r; iy < r; iy += 6) {
          if ((Math.floor((ix+r)/6) + Math.floor((iy+r)/6)) % 2 === 0) {
            ctx.fillRect(ix, iy, 6, 6);
          }
        }
      }
    } else if (style === 'checker4') {
      // Harlequins 4-color
      ctx.fillStyle = '#40E0D0'; ctx.fill();
      ctx.clip();
      ctx.fillStyle = '#CC0000';
      ctx.fillRect(0, -r, r, r);
      ctx.fillStyle = '#660000';
      ctx.fillRect(-r, 0, r, r);
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, r, r);
    } else {
      // Solid
      ctx.fillStyle = c1;
      ctx.fill();
    }
    // Border
    ctx.restore(); ctx.save(); ctx.translate(this.x, this.y);
    if (c2) {
      ctx.strokeStyle = c2;
      ctx.lineWidth = c3 ? 2 : 2.5;
      ctx.beginPath(); ctx.arc(0, 0, this.profile.r, 0, Math.PI*2); ctx.stroke();
    }
    if (c3) {
      ctx.strokeStyle = c3;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, this.profile.r - 2.5, 0, Math.PI*2); ctx.stroke();
    }
  }

  getNumColor(bgColor) {
    // Simple luminance check
    const hex = bgColor.replace('#','');
    const r = parseInt(hex.substr(0,2)||'ff',16);
    const g = parseInt(hex.substr(2,2)||'ff',16);
    const b = parseInt(hex.substr(4,2)||'ff',16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.45 ? '#111111' : '#FFFFFF';
  }
}

// ============================================================
// TACKLE BLOCK
// ============================================================
class TackleBlock {
  constructor(carrier, tackler, type, cg, tg) {
    this.carrier = carrier;
    this.tackler = tackler;
    this.type = type; // 'legs','waist','arms'
    this.cg = cg;     // charge gauge ratio
    this.tg = tg;     // tackle gauge ratio
    this.x = carrier.x;
    this.y = carrier.y;
    this.duration = 0;
    this.maxDuration = 1.2;
    this.fallen = false;
    this.penalty = null;
    this.yellowCard = false;
    this.canPassAfter = (type !== 'arms');
    this.passAfterDone = false;

    // Forward pass on red charge
    this.forwardBall = (cg > 0.85);

    // Momentum conservation
    const m1 = carrier.profile.mass, m2 = tackler.profile.mass;
    const total = m1 + m2;
    this.vx = (carrier.vx * m1 + tackler.vx * m2) / total;
    this.vy = (carrier.vy * m1 + tackler.vy * m2) / total;

    // Determine outcome
    const outcome = this.getOutcome();
    this.advance = outcome.advance; // pixels to advance
    this.balanceTime = outcome.balance * this.maxDuration;
    this.penalty = outcome.penalty || null;
    this.yellowCard = outcome.yellowCard || false;
    this.brokenTackle = outcome.broken || false;

    // Clamp block in field
    this.targetX = Math.max(FX, Math.min(FX + FW, this.x + this.vx * 0.3 + this.advance * (carrier.teamIdx === 0 ? 1 : -1)));
    this.targetY = Math.max(FY, Math.min(FY + FH, this.y + this.vy * 0.15));

    carrier.tackling = true; carrier.stunTime = 0.1;
    tackler.tackling = true; tackler.stunTime = 0.1;
    carrier.hasBall = !this.forwardBall;
  }

  getOutcome() {
    const cn = gaugeName(this.cg);
    const tn = gaugeName(this.tg);
    const t = this.type;

    // Lookup table [advance(px), balanceRatio, penalty, broken, yellowCard]
    const T = {
      legs: {
        'orange-rouge': {advance:0,   balance:0,    penalty:'Cathédrale',  yellowCard:true},
        'jaune-rouge':  {advance:0,   balance:0,    penalty:'Cathédrale',  yellowCard:true},
        'vert-rouge':   {advance:0,   balance:0,    penalty:'Cathédrale',  yellowCard:true},
        'rouge-rouge':  {advance:0,   balance:0,    penalty:'Cathédrale',  yellowCard:true},
        'vert-vert':    {advance:0,   balance:0.1},
        'vert-jaune':   {advance:20,  balance:0.3},
        'vert-orange':  {advance:80,  balance:1.0,  broken:true},
        'jaune-vert':   {advance:0,   balance:0.1},
        'jaune-jaune':  {advance:15,  balance:0.3},
        'jaune-orange': {advance:35,  balance:0.5},
        'orange-vert':  {advance:-10, balance:0.1},
        'orange-jaune': {advance:0,   balance:0.2},
        'orange-orange':{advance:10,  balance:0.3},
        'rouge-vert':   {advance:0,   balance:0,    broken:false}, // en-avant
        'rouge-jaune':  {advance:0,   balance:0,    broken:false},
        'rouge-orange': {advance:0,   balance:0,    broken:false},
      },
      waist: {
        'orange-rouge': {advance:0,   balance:0,    penalty:'Épaule'},
        'jaune-rouge':  {advance:0,   balance:0,    penalty:'Épaule'},
        'vert-rouge':   {advance:0,   balance:0,    penalty:'Épaule'},
        'rouge-rouge':  {advance:0,   balance:0,    penalty:'Épaule'},
        'vert-vert':    {advance:15,  balance:0.4},
        'vert-jaune':   {advance:30,  balance:0.6},
        'vert-orange':  {advance:80,  balance:1.0,  broken:true},
        'jaune-vert':   {advance:-10, balance:0.2},
        'jaune-jaune':  {advance:15,  balance:0.4},
        'jaune-orange': {advance:30,  balance:0.5},
        'orange-vert':  {advance:-20, balance:0.1},
        'orange-jaune': {advance:-10, balance:0.2},
        'orange-orange':{advance:0,   balance:0.3},
        'rouge-vert':   {advance:0,   balance:0},
        'rouge-jaune':  {advance:0,   balance:0},
        'rouge-orange': {advance:0,   balance:0},
      },
      arms: {
        'orange-rouge': {advance:0,   balance:0,    penalty:'Haut',       yellowCard:true},
        'jaune-rouge':  {advance:0,   balance:0,    penalty:'Haut',       yellowCard:true},
        'vert-rouge':   {advance:0,   balance:0,    penalty:'Haut',       yellowCard:true},
        'rouge-rouge':  {advance:0,   balance:0,    penalty:'Haut',       yellowCard:true},
        'vert-vert':    {advance:40,  balance:0.7},
        'vert-jaune':   {advance:55,  balance:0.8},
        'vert-orange':  {advance:80,  balance:1.0,  broken:true},
        'jaune-vert':   {advance:25,  balance:0.6},
        'jaune-jaune':  {advance:35,  balance:0.7},
        'jaune-orange': {advance:50,  balance:0.8},
        'orange-vert':  {advance:-25, balance:0.1},
        'orange-jaune': {advance:-10, balance:0.2},
        'orange-orange':{advance:0,   balance:0.3},
        'rouge-vert':   {advance:0,   balance:0},
        'rouge-jaune':  {advance:0,   balance:0},
        'rouge-orange': {advance:0,   balance:0},
      }
    };
    const key = cn + '-' + tn;
    return T[t][key] || {advance:0, balance:0.2};
  }

  update(dt, match) {
    if (this.fallen) return;
    this.duration += dt;

    if (this.brokenTackle) {
      // Carrier breaks free
      this.carrier.tackling = false;
      this.tackler.stunTime = 0.5;
      this.tackler.tackling = false;
      this.fallen = true;
      return;
    }

    // Move block
    const tx = this.targetX, ty = this.targetY;
    const prog = Math.min(1, this.duration / Math.max(0.01, this.balanceTime));
    this.x += (tx - this.x) * dt * 3;
    this.y += (ty - this.y) * dt * 3;
    this.carrier.x = this.x;
    this.carrier.y = this.y;
    this.tackler.x = this.x - (this.carrier.teamIdx === 0 ? -15 : 15);
    this.tackler.y = this.y;

    // Forward ball scatter
    if (this.forwardBall && !this._ballScattered) {
      this._ballScattered = true;
      match.ball.carrier = null;
      match.ball.x = this.x;
      match.ball.y = this.y;
      // Ball goes FORWARD (toward opponent try line)
      const fwd = this.carrier.teamIdx === 0 ? 1 : -1;
      match.ball.vx = fwd * (120 + Math.random() * 60);
      match.ball.vy = (Math.random() - 0.5) * 80;
      match.ball.vz = 80 + Math.random() * 60;
      match.ball.onGround = false;
      match.ball.loose = true;
      match.ball.team = -1;
      match.events.push({type:'forward_pass', msg:'En-avant !', dur:2});
    }

    if (this.duration >= Math.max(0.3, this.balanceTime) || this.advance < -5) {
      this.fallen = true;
      this.carrier.onGround = true;
      this.carrier.groundTime = 1.2;
      this.carrier.hasBall = !this.forwardBall && !this._ballScattered;
      this.carrier.tackling = false;
      this.tackler.onGround = this.type !== 'legs'; // only goes down on legs
      this.tackler.groundTime = 0.8;
      this.tackler.tackling = false;
      if (this.penalty) {
        match.events.push({type:'penalty', side: this.tackler.teamIdx, msg:'Pénalité: plaquage ' + this.penalty, dur:3});
        match.pendingPenalty = {side: this.carrier.teamIdx, x: this.x, y: this.y, reason: this.penalty};
        if (this.yellowCard) {
          this.tackler.yellowCard = true;
          this.tackler.yellowTime = 600; // 10 min
          match.events.push({type:'yellow', msg:'Carton Jaune !', dur:4});
        }
      }
      if (!this.forwardBall && this.carrier.hasBall) {
        // Ruck starts
        match.startRuck(this.carrier, this.tackler);
      }
    }
  }
}
// ============================================================
// RUCK CLASS
// ============================================================
class Ruck {
  constructor(carrier, tackler, x, y) {
    this.x = x; this.y = y;
    this.carrier = carrier;
    this.tackler = tackler;
    this.possession = carrier.teamIdx; // who has ball
    this.attackBar = 0.5; // 0=defender wins, 1=attacker wins
    this.contestBar = 0;  // 0=no contest
    this.attackPlayers = [carrier];
    this.defensePlayers = [tackler];
    this.maxPlayers = 3;
    this.active = true;
    this.timeToPlay = 5; // seconds before must play
    this.contested = false;
    this.hjLine = carrier.teamIdx === 0 ? x : x;
  }
  addPlayer(player, asAttack) {
    if (asAttack && this.attackPlayers.length < this.maxPlayers) {
      this.attackPlayers.push(player);
      player.inRuck = true;
      player.onGround = true;
      player.groundTime = 1.5;
      return true;
    } else if (!asAttack && this.defensePlayers.length < this.maxPlayers) {
      this.defensePlayers.push(player);
      player.inRuck = true;
      player.onGround = true;
      player.groundTime = 1.5;
      return true;
    }
    return false;
  }
  update(dt) {
    this.timeToPlay -= dt;
    if (this.timeToPlay <= 0) this.active = false;
    // Balance drift
    const atkStr = this.attackPlayers.length * 0.5;
    const defStr = this.defensePlayers.length * 0.4;
    this.attackBar = Math.max(0, Math.min(1, this.attackBar + (atkStr - defStr) * dt * 0.1));
    if (this.attackBar <= 0) {
      // Defense wins
      this.possession = 1 - this.possession;
      this.active = false;
    }
  }
  draw() {
    if (!this.active) return;
    ctx.save();
    // Ruck oval
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 2;
    ctx.setLineDash([4,3]);
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, 25, 18, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    // Possession bar
    const bw = 50, bh = 6, bx = this.x - bw/2, by = this.y - 28;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = this.possession === 0 ? '#3399FF' : '#FF4444';
    ctx.fillRect(bx, by, bw * this.attackBar, bh);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
    // HJ line
    ctx.strokeStyle = 'rgba(255,255,0,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(this.x, FY);
    ctx.lineTo(this.x, FY + FH);
    ctx.stroke();
    ctx.setLineDash([]);
    // Label
    ctx.fillStyle = '#FFD700';
    ctx.font = '9px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('RUCK', this.x, this.y + 28);
    ctx.restore();
  }
}

// ============================================================
// SCRUM CLASS
// ============================================================
class Scrum {
  constructor(x, y, possession, match) {
    this.x = x; this.y = y;
    this.possession = possession;
    this.match = match;
    this.phase = 'pre'; // pre, engage, push, done
    this.timer = 3;
    this.pushL = 0; // left prop push gauge
    this.pushR = 0; // right prop push gauge
    this.advance = 0; // positive = team1 pushes forward
    this.penalized = -1;
    this.settled = false;
    this.introDelay = 1.5;
    this.scrumFallen = false;
    this.deviation = 0; // turning
  }
  update(dt) {
    switch(this.phase) {
      case 'pre':
        this.introDelay -= dt;
        if (this.introDelay <= 0) this.phase = 'engage';
        break;
      case 'engage':
        this.timer -= dt;
        if (this.timer <= 0) { this.phase = 'push'; this.timer = 8; }
        // Check for early push (premature push = coup franc)
        if (INPUT.gp && (Math.abs(INPUT.ly()) > 0.5 || Math.abs(getRY()) > 0.5) && this.timer > 1) {
          if (this.possession === 0) {
            this.match.events.push({type:'penalty', msg:'Poussée anticipée !', dur:2});
            this.penalized = 0;
            this.phase = 'done';
          }
        }
        break;
      case 'push':
        this.timer -= dt;
        // Input-driven pushing
        const ly = getLY(), ry = getRY();
        const pushVal = Math.max(0, (-ly + -ry) / 2);
        if (pushVal > 0.2) {
          const gc = Math.min(1, pushVal);
          // Check for straight push (deviation check)
          const dev = Math.abs(getLX()) + Math.abs(getRX());
          if (dev > 0.4) {
            // Pushing sideways = penalty
            this.match.events.push({type:'penalty', msg:'Mêlée tournée !', dur:2});
            this.penalized = 0;
            this.phase = 'done';
            return;
          }
          if (gc > 0.85) {
            // Red = uncontrolled, player falls
            this.match.events.push({type:'penalty', msg:'Mêlée écroulée !', dur:2});
            this.penalized = 0;
            this.scrumFallen = true;
            this.phase = 'done';
            return;
          }
          const pushPow = gc * 0.02;
          this.advance += pushPow * (this.possession === 0 ? 1 : -1);
        } else {
          // CPU scrum push
          const cpuPush = 0.012 * (0.6 + Math.random() * 0.4);
          this.advance += cpuPush * (this.possession === 1 ? 1 : -1) * 0.6;
        }
        this.advance = Math.max(-1, Math.min(1, this.advance));
        if (Math.abs(this.advance) > 0.8) {
          // Dominant team penalizes losers
          this.penalized = this.advance > 0 ? 1 : 0;
          this.match.events.push({type:'penalty', msg:'Mêlée dominée !', dur:2});
          this.phase = 'done';
          return;
        }
        // Ball out options
        if (INPUT.gp ? INPUT.pressed(INPUT.A) : INPUT.kb['KeyZ']) {
          // Number 8 pick
          this.phase = 'done';
          this.settled = true;
          this.possession_winner = this.possession;
        }
        if (this.timer <= 0) {
          this.phase = 'done';
          this.settled = true;
          this.possession_winner = this.possession;
        }
        break;
    }
  }
  draw() {
    ctx.save();
    // Scrum pack oval
    const teamColor = this.possession === 0 ? '#3399FF' : '#FF4444';
    ctx.fillStyle = 'rgba(80,80,80,0.6)';
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, 45, 25, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Advance indicator
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('MÊLÉE', this.x, this.y - 35);
    // Push bar
    const bw = 80;
    ctx.fillStyle = '#333';
    ctx.fillRect(this.x - bw/2, this.y - 48, bw, 8);
    ctx.fillStyle = '#3399FF';
    ctx.fillRect(this.x, this.y - 48, (this.advance * bw / 2), 8);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(this.x - bw/2, this.y - 48, bw, 8);
    // Phase label
    ctx.fillStyle = '#aaa';
    ctx.font = '9px Arial';
    ctx.fillText(this.phase === 'engage' ? `Engagez! ${Math.ceil(this.timer)}s` : 
                  this.phase === 'push' ? `Poussez! LY+RY` : '', this.x, this.y + 38);
    ctx.restore();
  }
}

// ============================================================
// LINEOUT CLASS
// ============================================================
class Lineout {
  constructor(x, y, possession, match) {
    this.x = x; this.y = y;
    this.possession = possession;
    this.match = match;
    this.phase = 'choose'; // choose, throw, catch, maul
    this.numPlayers = 7;
    this.combo = 0; // 0=front, 1=middle, 2=tail, 3=middle maul
    this.comboNames = ['Avant (court)','Milieu','Queue (long)','Maul milieu'];
    this.timer = 5;
    this.throwGauge = 0;
    this.charging = false;
    this.jumped = false;
    this.jumpGauge = 0;
    this.success = false;
    this.targetPos = [1,3,5,3][this.combo];
  }
  update(dt) {
    switch(this.phase) {
      case 'choose':
        if (dUp() || INPUT.kb['ArrowUp']) { this.combo = (this.combo - 1 + 4) % 4; }
        if (dDown() || INPUT.kb['ArrowDown']) { this.combo = (this.combo + 1) % 4; }
        this.targetPos = [1,3,5,3][this.combo];
        if (btnAP()) this.phase = 'throw';
        break;
      case 'throw':
        this.timer -= dt;
        if (this.timer <= 0) {
          // Too slow = free kick for opponents
          this.match.events.push({type:'penalty', msg:'Lancer trop lent ! Coup franc.', dur:3});
          this.phase = 'done_fail';
          return;
        }
        // Charge throw
        if (getRY() < -0.3 || INPUT.kb['KeyI']) {
          this.charging = true;
          this.throwGauge = Math.min(1, this.throwGauge + dt * 0.8);
        } else if (this.charging && (getRY() > 0.3 || INPUT.kb['KeyK'])) {
          this.phase = 'catch';
          this.jumpTimer = 1.5;
        }
        break;
      case 'catch':
        this.jumpTimer -= dt;
        // Player presses Y to jump with gauge
        if ((btnY() || INPUT.kb['KeyV']) && !this.jumped) {
          this.jumped = true;
          this.jumpGauge = 0;
        }
        if (this.jumped) {
          this.jumpGauge = Math.min(1, this.jumpGauge + dt * 1.2);
        }
        if (this.jumpTimer <= 0) {
          // Evaluate success
          const throwQuality = gaugeName(this.throwGauge);
          const jumpQuality = this.jumped ? gaugeName(this.jumpGauge) : 'miss';
          const deviation = Math.abs(getLX()) + Math.abs(getLY());
          if (deviation > 0.5 && this.possession === 0) {
            // Bad throw direction = turnover
            this.success = false;
            this.match.events.push({type:'lineout_fail', msg:'Lancer de travers ! Mêlée adverse.', dur:3});
          } else if (jumpQuality === 'rouge' || throwQuality === 'rouge') {
            // Knock on in lineout
            this.success = false;
            this.match.events.push({type:'lineout_fail', msg:'En-avant en touche !', dur:3});
          } else {
            this.success = true;
          }
          if (this.combo === 3) {
            this.phase = 'maul';
          } else {
            this.phase = 'done';
          }
        }
        break;
      case 'maul':
        this.phase = 'done'; // Simplified - go to ruck
        break;
    }
  }
  draw() {
    ctx.save();
    const side = this.y < Y_MID ? -1 : 1; // which touchline
    const baseY = side < 0 ? FY + 15 : FY + FH - 15;

    if (this.phase === 'choose') {
      // Show combo selection
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(this.x - 140, baseY - 5 + side*30, 280, 100 * side);
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('TOUCHE - Choisir combinaison', this.x, baseY + side * 20);
      ctx.font = '10px Arial';
      for (let i = 0; i < this.comboNames.length; i++) {
        ctx.fillStyle = i === this.combo ? '#FFD700' : '#AAAAAA';
        ctx.fillText((i === this.combo ? '▶ ' : '  ') + this.comboNames[i], this.x, baseY + side * (35 + i * 14));
      }
      ctx.fillStyle = '#888';
      ctx.fillText('[D↑↓] Choisir  [A] Confirmer', this.x, baseY + side * 95);
    }

    // Draw lineout players visual
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(this.x, FY); ctx.lineTo(this.x, FY + FH);
    ctx.stroke();
    ctx.setLineDash([]);

    if (this.phase === 'throw' || this.phase === 'catch') {
      // Show throw gauge
      const gy = FY + FH/2;
      drawGauge(this.x - 60, gy - 8, 120, 12, this.throwGauge, 'Puissance lancer');
      if (this.phase === 'catch' && this.jumped) {
        drawGauge(this.x - 60, gy + 10, 120, 12, this.jumpGauge, 'Saut [Y]');
      } else if (this.phase === 'catch') {
        ctx.fillStyle = '#FFD700';
        ctx.font = '11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Appuyez [Y] pour sauter !', this.x, gy + 22);
      }
      ctx.fillStyle = '#FFD700';
      ctx.font = '10px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`Timer: ${this.timer.toFixed(1)}s`, this.x, gy - 20);
    }
    ctx.restore();
  }
}

// ============================================================
// KICK STATE
// ============================================================
class KickState {
  constructor(kicker, type) {
    this.kicker = kicker;
    this.type = type; // 'grubber','clearance','drop','upunder','penalty','conversion'
    this.gauge = 0;
    this.charging = false;
    this.dir = { x: kicker.teamIdx === 0 ? 1 : -1, y: 0 };
    this.done = false;
    this.maxPower = type === 'grubber' ? 0.7 : 1.0;
  }
  update(dt) {
    const lx = getLX(), ly = getLY();
    // Aim with left stick
    if (Math.abs(lx) > 0.1 || Math.abs(ly) > 0.1) {
      this.dir.x = lx; this.dir.y = ly;
      const m = Math.sqrt(lx*lx + ly*ly);
      this.dir.x /= m; this.dir.y /= m;
    }
    this.gauge = Math.min(this.maxPower, this.gauge + dt * 0.65);
  }
  release(ball, match) {
    const g = this.gauge;
    const t = this.type;
    const spd = SCALE * (t === 'grubber' ? 22 : t === 'clearance' ? 30 : t === 'upunder' ? 20 : 26);
    const vz = t === 'grubber' ? 0 : t === 'upunder' ? (160 + g*80) : t === 'clearance' ? (100 + g*100) : (80 + g*100);
    ball.kick(
      this.dir.x * spd * (0.5 + g * 0.8),
      this.dir.y * spd * (0.5 + g * 0.8),
      vz,
      t
    );
    this.done = true;
    match.events.push({type:'kick', msg:t === 'grubber' ? 'Kick rasant' : t === 'clearance' ? 'Dégagement' : t === 'upunder' ? 'Chandelle' : 'Drop', dur:1.5});
    // Track kick origin for 50-22 rule
    match.lastKickPos = { x: this.kicker.x, y: this.kicker.y, team: this.kicker.teamIdx };
    match.lastKickType = t;
  }
  draw() {
    const colors = {grubber:'#FF8C00', clearance:'#FFD700', drop:'#00CC44', upunder:'#87CEEB'};
    const kx = this.kicker.x, ky = this.kicker.y;
    // Aim line
    ctx.save();
    ctx.strokeStyle = colors[this.type] || '#fff';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,3]);
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(kx, ky);
    ctx.lineTo(kx + this.dir.x * 200 * (0.5 + this.gauge), ky + this.dir.y * 200 * (0.5 + this.gauge));
    ctx.stroke();
    ctx.setLineDash([]);
    // Arrow head
    const ax = kx + this.dir.x * 200 * (0.5 + this.gauge);
    const ay = ky + this.dir.y * 200 * (0.5 + this.gauge);
    ctx.globalAlpha = 1;
    ctx.fillStyle = colors[this.type] || '#fff';
    ctx.beginPath();
    ctx.arc(ax, ay, 4, 0, Math.PI*2);
    ctx.fill();
    // Gauge
    drawGauge(kx - 35, ky + 20, 70, 8, this.gauge, this.type.toUpperCase());
    ctx.restore();
  }
}

// ============================================================
// PENALTY KICK / CONVERSION
// ============================================================
class PenaltyKick {
  constructor(x, y, team, type, match) {
    this.x = x; this.y = y;
    this.team = team;
    this.type = type; // 'penalty' or 'conversion'
    this.match = match;
    this.aimX = 0; // horizontal aim offset in degrees from center
    this.power = 0;
    this.phase = 'aim'; // aim, kick, result
    this.result = null;
    this.timer = 0;
    this.angle = 0; // right stick angle for height
    // Calculate difficulty
    const postX = team === 0 ? X_TRY_R : X_TRY_L;
    const postY = Y_MID;
    const dist = Math.sqrt((this.x - postX)**2 + (this.y - postY)**2) / SCALE; // meters
    this.distance = dist;
    this.angle_to_posts = Math.abs(this.y - postY) / SCALE;
  }
  update(dt) {
    if (this.phase === 'aim') {
      this.aimX += getLX() * dt * 30;
      this.aimX = Math.max(-30, Math.min(30, this.aimX));
      if (btnX() || INPUT.kb['KeyC']) {
        this.power = Math.min(1, this.power + dt * 0.7);
      } else if (this.power > 0) {
        this.phase = 'kick';
        this.evaluateKick();
      }
    }
    if (this.phase === 'result') {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.match.penaltyKickDone(this.result, this.type, this.team);
        this.phase = 'done';
      }
    }
  }
  evaluateKick() {
    const g = this.power;
    const gn = gaugeName(g);
    // Distance factor (50m = needs vert, 30m = easier)
    const distFactor = Math.max(0, 1 - this.distance / 55);
    // Power check
    let success = false;
    if (gn === 'vert') {
      success = Math.random() < (0.9 - this.distance / 100);
    } else if (gn === 'jaune') {
      success = this.distance < 30 && Math.random() < 0.7;
    } else if (gn === 'orange') {
      success = this.distance < 20 && Math.random() < 0.5;
    } else {
      // rouge = too much power
      success = Math.random() < 0.3;
    }
    // Aim penalty
    if (Math.abs(this.aimX) > 15) success = false;
    this.result = success;
    this.phase = 'result';
    this.timer = 2;
    this.match.events.push({type: success ? 'goal' : 'miss', msg: success ? (this.type === 'penalty' ? 'Pénalité ! 3 pts' : 'Transformation ! 2 pts') : 'Raté !', dur:3});
  }
  draw() {
    const postX = this.team === 0 ? X_TRY_R : X_TRY_L;
    const postY = Y_MID;
    ctx.save();
    // Aim line to posts
    ctx.strokeStyle = this.phase === 'result' ? (this.result ? '#00FF00' : '#FF0000') : '#FFD700';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,3]);
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    const aimRad = (this.aimX * Math.PI / 180);
    const dx = Math.cos(aimRad) * (postX - this.x) - Math.sin(aimRad) * (postY - this.y);
    const dy = Math.sin(aimRad) * (postX - this.x) + Math.cos(aimRad) * (postY - this.y);
    ctx.lineTo(this.x + dx, this.y + dy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    // Power gauge
    drawGauge(this.x - 50, this.y + 20, 100, 10, this.power, 'Puissance [X]');
    // Aim indicator
    ctx.fillStyle = '#FFD700';
    ctx.font = '10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`Aim: ${this.aimX.toFixed(0)}° [LX]   Dist: ${this.distance.toFixed(0)}m`, this.x, this.y - 20);
    if (this.phase === 'result') {
      ctx.font = 'bold 24px Arial';
      ctx.fillStyle = this.result ? '#00FF44' : '#FF3322';
      ctx.fillText(this.result ? 'RÉUSSI !' : 'RATÉ !', postX, postY - 60);
    }
    ctx.restore();
  }
}

// FIELD RENDERER
// ============================================================
function drawField() {
  // Background
  ctx.fillStyle = '#1a4a1a';
  ctx.fillRect(0, 0, W, H);

  // Tribunes effect (perspective)
  drawTribunes();

  // Field grass (alternating stripes)
  const stripeW = 40;
  for (let sx = FX; sx < FX + FW; sx += stripeW) {
    ctx.fillStyle = (Math.floor((sx - FX) / stripeW) % 2 === 0) ? '#2d7a2d' : '#2a7030';
    ctx.fillRect(sx, FY, Math.min(stripeW, FX + FW - sx), FH);
  }

  // In-goal zones
  ctx.fillStyle = 'rgba(0,80,0,0.35)';
  ctx.fillRect(FX, FY, 10 * SCALE, FH);          // left in-goal
  ctx.fillRect(X_TRY_R, FY, 10 * SCALE, FH);     // right in-goal

  // Field lines
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;

  // Boundary
  ctx.strokeRect(FX, FY, FW, FH);

  // Try lines
  ctx.lineWidth = 3;
  vLine(X_TRY_L); vLine(X_TRY_R);

  // 22m lines
  ctx.lineWidth = 2;
  vLine(X_22L); vLine(X_22R);

  // Halfway
  ctx.lineWidth = 2.5;
  vLine(X_MID);

  // 10m lines (dashed)
  ctx.setLineDash([8, 5]);
  ctx.lineWidth = 1.5;
  vLine(X_10L); vLine(X_10R);
  ctx.setLineDash([]);

  // 5m lines from touchlines
  ctx.setLineDash([4, 4]);
  ctx.lineWidth = 1;
  hLine(FY + 5 * SCALE);
  hLine(FY + FH - 5 * SCALE);
  ctx.setLineDash([]);

  // 22m labels
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '11px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('22m', X_22L, FY + 12);
  ctx.fillText('22m', X_22R, FY + 12);
  ctx.fillText('50m', X_MID, FY + 12);

  // Goal posts
  drawPosts(X_TRY_L, Y_MID, true);
  drawPosts(X_TRY_R, Y_MID, false);

  // Touch judges
  drawTouchJudge(FY - 18, match ? match.ball.x : X_MID);
  drawTouchJudge(FY + FH + 18, match ? match.ball.x : X_MID);
}

function vLine(x) {
  ctx.beginPath(); ctx.moveTo(x, FY); ctx.lineTo(x, FY + FH); ctx.stroke();
}
function hLine(y) {
  ctx.beginPath(); ctx.moveTo(FX, y); ctx.lineTo(FX + FW, y); ctx.stroke();
}

function drawPosts(x, y, facingRight) {
  const postH = 18, crossW = 8, legH = 5;
  ctx.save();
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 2.5;
  // Left post
  ctx.beginPath();
  ctx.moveTo(x - crossW, y + legH);
  ctx.lineTo(x - crossW, y - postH);
  ctx.stroke();
  // Right post
  ctx.beginPath();
  ctx.moveTo(x + crossW, y + legH);
  ctx.lineTo(x + crossW, y - postH);
  ctx.stroke();
  // Crossbar
  ctx.beginPath();
  ctx.moveTo(x - crossW, y - 4);
  ctx.lineTo(x + crossW, y - 4);
  ctx.stroke();
  // Center stem
  ctx.beginPath();
  ctx.moveTo(x, y + legH);
  ctx.lineTo(x, y - 3);
  ctx.stroke();
  ctx.restore();
}

function drawTribunes() {
  // Simple perspective tribune bands
  const colors = ['#3a2a1a','#4a3a2a','#3a2a1a','#4a3a2a'];
  // Top tribune
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.moveTo(FX - 30 + i*8, FY - 15 - i*8);
    ctx.lineTo(FX + FW + 30 - i*8, FY - 15 - i*8);
    ctx.lineTo(FX + FW + 25 - (i+1)*8, FY - 15 - (i+1)*8);
    ctx.lineTo(FX - 25 + (i+1)*8, FY - 15 - (i+1)*8);
    ctx.closePath();
    ctx.fill();
    // Spectators (dots)
    ctx.fillStyle = colors[i];
    for (let sx = FX - 20 + i*6; sx < FX + FW + 20 - i*6; sx += 10) {
      const spColor = `hsl(${Math.floor(Math.random()*360)},50%,${40+i*5}%)`;
      // Use deterministic positioning
      const seed = Math.floor(sx * 7 + i * 13);
      ctx.fillStyle = `hsl(${(seed * 137) % 360},45%,${35+i*5}%)`;
      ctx.beginPath();
      ctx.arc(sx, FY - 20 - i*8, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // Bottom tribune
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.moveTo(FX - 30 + i*8, FY + FH + 15 + i*8);
    ctx.lineTo(FX + FW + 30 - i*8, FY + FH + 15 + i*8);
    ctx.lineTo(FX + FW + 25 - (i+1)*8, FY + FH + 15 + (i+1)*8);
    ctx.lineTo(FX - 25 + (i+1)*8, FY + FH + 15 + (i+1)*8);
    ctx.closePath();
    ctx.fill();
    for (let sx = FX - 20 + i*6; sx < FX + FW + 20 - i*6; sx += 10) {
      const seed = Math.floor(sx * 11 + i * 17 + 1000);
      ctx.fillStyle = `hsl(${(seed * 137) % 360},45%,${35+i*5}%)`;
      ctx.beginPath();
      ctx.arc(sx, FY + FH + 20 + i*8, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // Side tribunes
  for (let i = 0; i < 3; i++) {
    // Left
    ctx.fillStyle = colors[i];
    for (let sy = FY + 10; sy < FY + FH - 10; sy += 10) {
      const seed = Math.floor(sy * 7 + i * 9 + 500);
      ctx.fillStyle = `hsl(${(seed * 137) % 360},45%,${35+i*5}%)`;
      ctx.beginPath();
      ctx.arc(FX - 25 - i*8, sy, 3, 0, Math.PI*2);
      ctx.fill();
    }
    // Right
    for (let sy = FY + 10; sy < FY + FH - 10; sy += 10) {
      const seed = Math.floor(sy * 11 + i * 13 + 750);
      ctx.fillStyle = `hsl(${(seed * 137) % 360},45%,${35+i*5}%)`;
      ctx.beginPath();
      ctx.arc(FX + FW + 25 + i*8, sy, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function drawTouchJudge(y, ballX) {
  const tx = Math.max(FX, Math.min(FX + FW, ballX));
  ctx.save();
  ctx.fillStyle = '#2d7a2d';
  ctx.strokeStyle = '#FFD700';

  ctx.fillStyle = '#FFD700';
  ctx.fillRect(tx + 4, fy - 8, 4, 2.5);
  ctx.fillRect(tx + 8, fy - 5.5, 4, 2.5);

}

let eventMessages = [];
function drawEvents(match) {
  if (!match.events) return;
  // Animate events
  const now = Date.now() / 1000;
  for (let ev of match.events) {
    if (!ev._startTime) ev._startTime = now;
    const elapsed = now - ev._startTime;
    if (elapsed > ev.dur) continue;
    const alpha = Math.min(1, Math.min(elapsed * 3, (ev.dur - elapsed) * 2));
    const yOff = -elapsed * 15;
    ctx.save();
    ctx.globalAlpha = alpha;
    const colors = {penalty:'#FF8C00', yellow:'#FFD700', try:'#00FF44', goal:'#00FF44',
                     forward_pass:'#FF4400', miss:'#FF3322', kick:'#87CEEB', lineout_fail:'#FF8C00'};
    ctx.fillStyle = colors[ev.type] || '#FFFFFF';
    ctx.font = `bold ${ev.type === 'try' ? 32 : 18}px Arial`;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.fillText(ev.msg, W/2, H/2 - 40 + yOff);
    ctx.restore();
  }
  // Clean old events
  match.events = match.events.filter(ev => {
    if (!ev._startTime) return true;
    return (Date.now()/1000 - ev._startTime) < ev.dur + 0.5;
  });
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
  ctx.fillText('PÉNALITÉ POUR VOUS', W/2, by + 18);
  ctx.fillStyle = '#aaa'; ctx.font = '11px Arial';
  ctx.fillText(pc.reason || 'Faute adverse', W/2, by + 32);
  for (let i = 0; i < opts.length; i++) {
    ctx.fillStyle = pc.selected === i ? '#FFD700' : '#CCCCCC';
    ctx.font = (pc.selected === i ? 'bold ' : '') + '11px Arial';
    ctx.fillText((pc.selected === i ? '▶ ' : '  ') + opts[i], W/2, by + 52 + i * 22);
  }
  ctx.fillStyle = '#666'; ctx.font = '10px Arial';
  ctx.fillText('[D↑↓] Choisir  [A] Confirmer', W/2, by + 130);
}
// ============================================================
// MATCH CLASS - MAIN GAME LOGIC
// ============================================================
class Match {
  constructor(team1Data, team2Data, team1Players, team2Players) {
    this.team1Data = team1Data;
    this.team2Data = team2Data;
    this.score = [0, 0];
    this.time = 0;
    this.half = 1;
    this.phase = 'kickoff'; // open, ruck, scrum, lineout, kickoff, penalty, penaltyChoice, conversion, halftime, fulltime
    this.ball = new Ball();
    this.team1 = this.createPlayers(team1Data, team1Players, 0);
    this.team2 = this.createPlayers(team2Data, team2Players, 1);
    this.allPlayers = [...this.team1, ...this.team2];
    this.controlledPlayer = this.getKicker(0);
    this.kickoff = 0; // who kicks off
    this.possession = 0;
    this.events = [];
    this.tackleBlock = null;
    this.ruck = null;
    this.scrum = null;
    this.lineout = null;
    this.kickState = null;
    this.penaltyKick = null;
    this.pendingPenalty = null;
    this.pendingPenaltyChoice = null;
    this.chargeState = { active: false, gauge: 0 };
    this.passState = { active: false, gauge: 0, dir: 0 };
    this.rushDefense = false;
    this.defenseSpacing = 2; // 1-5
    this.attackDepth = 1;    // 1-3
    this.halfStarted = false;
    this.lastKickPos = null;
    this.lastKickType = null;
    this.rtPressCount = 0;
    this.rtLastTime = 0;
    this.dUpCount = 0;
    this.dUpLastTime = 0;
    this.totalGameTime = 40 * 60; // 40 min per half in real time... accelerated
    this.timeMultiplier = 2; // 1 real second = 2 game seconds
    this.paused = false;

    // Place teams for kickoff
    this.setupKickoff();
    this.ball.x = X_MID; this.ball.y = Y_MID;
    this.ball.team = -1;
  }

  createPlayers(teamData, playerList, teamIdx) {
    const players = [];
    for (let i = 0; i < 15; i++) {
      const pd = playerList[i] || {n: 'Joueur ' + (i+1), r: 75};
      // Position on field
      const pos = this.getStartPos(teamIdx, i);
      const p = new Player(teamIdx, i + 1, i, pos.x, pos.y, pd.n, pd.r);
      players.push(p);
    }
    return players;
  }

  getStartPos(teamIdx, posIdx) {
    // Attacking direction: team0 attacks right (start in left half), team1 attacks left (start in right half)
    const side = teamIdx === 0 ? -1 : 1;
    const midX = X_MID;
    const midY = Y_MID;
    const s = SCALE;
    // Formation positions relative to center
    const formations = [
      // Forwards in a 3-4-1 scrum shape initially
      {dx:-12*s,dy:-5*s},{dx:-12*s,dy:0},{dx:-12*s,dy:5*s},  // front row
      {dx:-16*s,dy:-3*s},{dx:-16*s,dy:3*s},                   // locks
      {dx:-18*s,dy:-6*s},{dx:-18*s,dy:6*s},                   // flankers
      {dx:-20*s,dy:0},                                          // n8
      {dx:-22*s,dy:2*s},                                        // sh
      {dx:-25*s,dy:-7*s},                                       // fo
      {dx:-30*s,dy:14*s},                                       // wing L
      {dx:-28*s,dy:-5*s},                                       // centre L
      {dx:-28*s,dy:5*s},                                        // centre R
      {dx:-30*s,dy:-14*s},                                      // wing R
      {dx:-35*s,dy:0},                                          // fb
    ];
    const f = formations[posIdx] || {dx:0, dy:0};
    return {
      x: midX + side * (-f.dx),
      y: midY + f.dy
    };
  }

  setupKickoff() {
    // Reset to kickoff positions
    for (let i = 0; i < 15; i++) {
      const p0 = this.team1[i], p1 = this.team2[i];
      const pos0 = this.getStartPos(0, i);
      const pos1 = this.getStartPos(1, i);
      p0.x = pos0.x; p0.y = pos0.y;
      p1.x = pos1.x; p1.y = pos1.y;
      p0.vx = p0.vy = 0;
      p1.vx = p1.vy = 0;
      p0.onGround = false; p1.onGround = false;
      p0.hasBall = false; p1.hasBall = false;
      p0.inRuck = false; p1.inRuck = false;
    }
    this.ball.x = X_MID; this.ball.y = Y_MID;
    this.ball.carrier = null;
    this.ball.vx = this.ball.vy = this.ball.vz = 0;
    this.ball.onGround = true;
    this.ball.loose = false;
    this.ball.team = -1;
    this.ball.inTouch = false;
    this.phase = 'kickoff';
  }

  getKicker(teamIdx) {
    return teamIdx === 0 ? this.team1[9] : this.team2[9]; // #10 is kicker
  }
  getScrum9(teamIdx) {
    return teamIdx === 0 ? this.team1[8] : this.team2[8]; // #9
  }

  getBallCarrier() {
    for (let p of this.allPlayers) {
      if (p.hasBall) return p;
    }
    return null;
  }

  update(dt) {
    if (this.paused) return;
    INPUT.poll();

    // Gamepad hot-swap keyboard state
    INPUT._prevKb = {...INPUT.kb};

    // Timer
    if (['open','ruck','kickoff'].includes(this.phase)) {
      this.time += dt * this.timeMultiplier;
      if (this.time >= this.totalGameTime) {
        if (this.half === 1) {
          this.half = 2;
          this.time = 0;
          this.events.push({type:'half', msg:'MI-TEMPS !', dur:4});
          this.setupKickoff();
          this.kickoff = 1 - this.kickoff;
          this.phase = 'kickoff';
        } else {
          this.phase = 'fulltime';
          this.events.push({type:'fulltime', msg:'COUP DE SIFFLET FINAL !', dur:6});
        }
        return;
      }
    }

    // Update all players
    for (let p of this.allPlayers) p.update(dt);

    // Update ball
    this.ball.update(dt);

    // Handle phases
    switch (this.phase) {
      case 'kickoff': this.updateKickoff(dt); break;
      case 'open':    this.updateOpen(dt); break;
      case 'ruck':    this.updateRuck(dt); break;
      case 'scrum':   this.updateScrum(dt); break;
      case 'lineout': this.updateLineout(dt); break;
      case 'penaltyChoice': this.updatePenaltyChoice(dt); break;
      case 'conversion': case 'penaltyKick': this.updatePenaltyKick(dt); break;
      case 'halftime': case 'fulltime': break;
    }

    // Tackle block
    if (this.tackleBlock && !this.tackleBlock.fallen) {
      this.tackleBlock.update(dt, this);
    }

    // Kick state
    if (this.kickState) {
      this.kickState.update(dt);
    }

    // Touch detection
    this.checkTouch();

    // Try detection
    this.checkTry();

    // Auto control switch (nearest to ball when loose)
    if (this.ball.loose && !this.ball.carrier) {
      this.autoChase();
    }

    // Pause
    if (btnStart()) {
      GAME.state = 'pause';
    }

    // Playbook
    if (btnSel()) {
      // TODO: playbook menu
    }
  }

  updateKickoff(dt) {
    const isPlayerKick = this.kickoff === 0;
    const kicker = this.getKicker(this.kickoff);
    this.controlledPlayer = kicker;

    if (!this.kickState && !this.halfStarted) {
      // Show kickoff instruction
      if (isPlayerKick) {
        // Player initiates kick
        if (btnB() || INPUT.kb['KeyX']) {
          this.kickState = new KickState(kicker, 'clearance');
          this.halfStarted = true;
        }
      } else {
        // CPU kicks
        this.halfStarted = true;
        setTimeout(() => this.cpuKickoff(), 1500);
      }
    }
    if (this.kickState) {
      this.kickState.update(dt);
      if (!btnB() && !INPUT.kb['KeyX'] && this.kickState.gauge > 0.1 && this.kickState.charging) {
        this.kickState.release(this.ball, this);
        this.kickState = null;
        this.phase = 'open';
        this.possession = -1;
        kicker.hasBall = false;
        this.ball.team = -1;
        this.halfStarted = false;
      }
      if (btnB() || INPUT.kb['KeyX']) {
        this.kickState.charging = true;
      }
    }
  }

  cpuKickoff() {
    const kicker = this.getKicker(this.kickoff);
    // CPU kicks off toward opponent half
    const dir = this.kickoff === 1 ? -1 : 1;
    this.ball.carrier = null;
    this.ball.x = X_MID; this.ball.y = Y_MID;
    this.ball.kick(dir * (200 + Math.random()*80), (Math.random()-0.5)*60, 180, 'clearance');
    this.ball.team = -1;
    this.phase = 'open';
    this.possession = -1;
    this.halfStarted = false;
    this.controlledPlayer = this.team1[14]; // Switch to fullback to receive
  }

  updateOpen(dt) {
    // Check for player input
    const ctrl = this.controlledPlayer;
    if (!ctrl) { this.controlledPlayer = this.team1[8]; return; }

    // Movement
    const lx = getLX(), ly = getLY();
    ctrl.isSprinting = btnRT() && !btnLT();

    if (!this.kickState) {
      ctrl.move(lx, ly);
    }

    // Kick actions (when ball carrier)
    if (ctrl.hasBall && !this.kickState && !this.tackleBlock) {
      if (btnA() || INPUT.kb['KeyZ']) {
        this.kickState = new KickState(ctrl, 'grubber');
      } else if (btnB() || INPUT.kb['KeyX']) {
        this.kickState = new KickState(ctrl, 'clearance');
      } else if (btnX() || INPUT.kb['KeyC']) {
        this.kickState = new KickState(ctrl, 'drop');
      } else if (btnY() || INPUT.kb['KeyV']) {
        this.kickState = new KickState(ctrl, 'upunder');
      }
    }

    // Kick release
    if (this.kickState && ctrl.hasBall) {
      this.kickState.update(dt);
      const released = (this.kickState.type === 'grubber' && (!btnA() && !INPUT.kb['KeyZ'])) ||
                        (this.kickState.type === 'clearance' && (!btnB() && !INPUT.kb['KeyX'])) ||
                        (this.kickState.type === 'drop' && (!btnX() && !INPUT.kb['KeyC'])) ||
                        (this.kickState.type === 'upunder' && (!btnY() && !INPUT.kb['KeyV']));
      if (released && this.kickState.gauge > 0.05) {
        ctrl.hasBall = false;
        this.ball.carrier = null;
        this.kickState.release(this.ball, this);
        this.kickState = null;
        this.stamina_drain(ctrl, 0.04);
        return;
      }
      if (this.kickState && this.kickState.gauge < 0.02) this.kickState.charging = true;
    }

    // Charge with right stick up (no ball carry = tackle)
    if (!ctrl.hasBall) {
      this.handleTackleInput(ctrl, dt);
    } else {
      this.handleCarrierInput(ctrl, dt);
    }

    // Right stick = pass
    if (ctrl.hasBall && !this.kickState) {
      const rx = getRX(), ry = getRY();
      if (Math.abs(rx) > 0.4 && !this.passState.active) {
        this.passState = { active: true, dir: rx > 0 ? 1 : -1, gauge: 0 };
      }
      if (this.passState.active) {
        this.passState.gauge = Math.min(1, this.passState.gauge + dt * 0.7);
        // Check for release
        const stillHeld = (this.passState.dir > 0 && getRX() > 0.3) || (this.passState.dir < 0 && getRX() < -0.3);
        if (!stillHeld) {
          this.executePass(ctrl, this.passState);
          this.passState = { active: false, gauge: 0, dir: 0 };
        }
      }
    } else {
      this.passState = { active: false, gauge: 0, dir: 0 };
    }

    // D-pad movements
    this.handleDpad();

    // Auto-select nearest player to ball when no ball
    if (!ctrl.hasBall && !this.ball.loose) {
      // Switch controlled player to ball carrier if they're closer
      const carrier = this.getBallCarrier();
      if (carrier && carrier.teamIdx === 0) {
        this.controlledPlayer = carrier;
      }
    }

    // CPU AI
    this.updateCPU(dt);

    // Collision: tackle attempts
    this.checkTackleCollisions();
  }

  handleCarrierInput(ctrl, dt) {
    const rx = getRX(), ry = getRY();
    // Charge (right stick up while has ball)
    if (ry < -0.4 && !this.passState.active) {
      this.chargeState.active = true;
      this.chargeState.gauge = Math.min(1, this.chargeState.gauge + dt * 0.55);
    } else if (this.chargeState.active && ry >= -0.1) {
      this.chargeState.active = false;
      // Keep gauge for collision check
    }
    if (!this.chargeState.active && this.chargeState.gauge > 0) {
      this.chargeState.gauge = Math.max(0, this.chargeState.gauge - dt * 0.4);
    }

    // Skills (LT + stick)
    if (btnLT()) {
      const rx2 = getRX(), ry2 = getRY();
      if (Math.abs(rx2) > 0.6 && !ctrl._skillCooldown) {
        // Crochet - dash in stick direction
        ctrl.vx += rx2 * 180;
        ctrl.vy += ry2 * 180;
        ctrl._skillCooldown = 0.4;
        this.stamina_drain(ctrl, 0.03);
        this.events.push({type:'skill', msg: rx2 > 0 ? 'Crochet →' : 'Crochet ←', dur:1});
      }
    }
    if (ctrl._skillCooldown) ctrl._skillCooldown -= dt;
  }

  handleTackleInput(ctrl, dt) {
    const ry = getRY();
    // Charge tackle gauge
    if (ry < -0.4) {
      ctrl.tackleGauge = Math.min(1, ctrl.tackleGauge + dt * 0.7);
      ctrl.isTackling = true;
    } else {
      ctrl.tackleGauge = Math.max(0, ctrl.tackleGauge - dt * 0.5);
      if (ctrl.tackleGauge < 0.1) ctrl.isTackling = false;
    }

    // Select tackle type from buttons
    if (btnA() || INPUT.kb['KeyZ']) ctrl.tackleType = 'legs';
    else if (btnB() || INPUT.kb['KeyX']) ctrl.tackleType = 'waist';
    else if (btnY() || INPUT.kb['KeyV']) ctrl.tackleType = 'arms';
    else if (!btnA() && !btnB() && !btnY()) ctrl.tackleType = ctrl.tackleType || 'legs';
  }

  executePass(carrier, ps) {
    // Determine target based on gauge
    const dir = ps.dir; // 1=right, -1=left
    const gn = gaugeName(ps.gauge);
    const teammates = this.team1.filter(p => p !== carrier && !p.onGround && !p.inRuck);
    // Sort by distance in pass direction
    const sorted = teammates.sort((a, b) => {
      const ad = dir > 0 ? (a.x - carrier.x) : (carrier.x - a.x);
      const bd = dir > 0 ? (b.x - carrier.x) : (carrier.x - b.x);
      const adist = Math.sqrt((a.x-carrier.x)**2 + (a.y-carrier.y)**2);
      const bdist = Math.sqrt((b.x-carrier.x)**2 + (b.y-carrier.y)**2);
      return adist - bdist;
    }).filter(p => {
      const inDir = dir > 0 ? p.x > carrier.x - 30 : p.x < carrier.x + 30;
      return inDir;
    });

    const targetIdx = gn === 'orange' ? 0 : gn === 'jaune' ? 1 : gn === 'vert' ? 2 : 3;
    const target = sorted[Math.min(targetIdx, sorted.length - 1)];

    if (!target || gn === 'rouge') {
      // No target or too long = ball loose
      carrier.hasBall = false;
      this.ball.carrier = null;
      const passDir = dir * (carrier.teamIdx === 0 ? 1 : -1);
      // Check if pass is legal (backward)
      const fwdBias = dir * (carrier.teamIdx === 0 ? 1 : -1); // +1 means forward for team0
      this.ball.vx = passDir * 180 + carrier.vx;
      this.ball.vy = (Math.random() - 0.5) * 60 + carrier.vy;
      this.ball.vz = 40;
      this.ball.onGround = false;
      this.ball.loose = true;
      this.ball.team = -1;
      this.events.push({type:'forward_pass', msg:'Passe en l\'air... libre !', dur:2});
      return;
    }

    // Check for forward pass
    const isForward = (carrier.teamIdx === 0 && target.x > carrier.x + 15) ||
                       (carrier.teamIdx === 1 && target.x < carrier.x - 15);
    if (isForward) {
      carrier.hasBall = false;
      this.ball.carrier = null;
      this.ball.vx = (target.x - carrier.x) / 0.4;
      this.ball.vy = (target.y - carrier.y) / 0.4;
      this.ball.vz = 60;
      this.ball.onGround = false;
      this.ball.loose = true;
      this.ball.team = -1;
      this.events.push({type:'forward_pass', msg:'EN-AVANT !', dur:2.5});
      this.pendingPenalty = {side: 1, x: carrier.x, y: carrier.y, reason: 'En-avant'};
      return;
    }

    // Successful pass
    carrier.hasBall = false;
    this.ball.carrier = null;
    this.ball.loose = false;
    // Animate ball flight
    const dx = target.x - carrier.x, dy = target.y - carrier.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const spd = 350;
    this.ball.vx = dx/dist * spd + carrier.vx * 0.3;
    this.ball.vy = dy/dist * spd + carrier.vy * 0.3;
    this.ball.vz = 30;
    this.ball.onGround = false;
    this.ball.team = carrier.teamIdx;

    // Schedule catch
    const travelTime = dist / spd;
    const tgt = target;
    setTimeout(() => {
      if (tgt && !tgt.onGround && !tgt.inRuck) {
        tgt.hasBall = true;
        this.ball.carrier = tgt;
        this.ball.loose = false;
        this.ball.team = carrier.teamIdx;
        if (carrier.teamIdx === 0) {
          this.controlledPlayer = tgt;
        }
      }
    }, travelTime * 800);
    this.stamina_drain(carrier, 0.015);
  }

  checkTackleCollisions() {
    if (this.tackleBlock) return; // Already in tackle
    const carrier = this.getBallCarrier();
    if (!carrier) return;
    const defenders = carrier.teamIdx === 0 ? this.team2 : this.team1;
    const myTeam = carrier.teamIdx === 0 ? this.team1 : this.team2;

    for (let def of defenders) {
      if (def.onGround || def.inRuck || def.stunTime > 0) continue;
      const d = carrier.dist(def);
      const tackleRange = def.profile.r + carrier.profile.r + 4;
      if (d < tackleRange) {
        // Tackle collision!
        const tType = def.tackleType || 'legs';
        const tg = def.tackleGauge;
        const cg = this.chargeState.gauge;

        // Check if this is the player-controlled defender
        if (def === this.controlledPlayer || def.teamIdx === 1) {
          this.tackleBlock = new TackleBlock(carrier, def, tType, cg, tg || (0.3 + Math.random() * 0.4));
          this.chargeState = { active: false, gauge: 0 };
          def.tackleGauge = 0;
          this.events.push({type:'tackle', msg:'Plaquage ' + tType + '!', dur:1.5});

          // Switch control to nearest other player
          if (carrier.teamIdx === 0) {
            this.switchToNearestPlayer(carrier);
          }
        }
        break;
      }
    }
  }

  updateRuck(dt) {
    if (!this.ruck || !this.ruck.active) {
      // Ruck resolved
      const winner = this.ruck ? this.ruck.possession : this.possession;
      this.possession = winner;
      if (winner === 0) {
        // My scrum half comes to pick up
        const sh = this.getScrum9(0);
        if (!sh.onGround) {
          sh.hasBall = true;
          this.ball.carrier = sh;
          this.ball.team = 0;
          this.controlledPlayer = sh;
        }
      } else {
        // CPU scrum half picks up
        const sh = this.getScrum9(1);
        if (!sh.onGround) {
          sh.hasBall = true;
          this.ball.carrier = sh;
          this.ball.team = 1;
        }
      }
      this.ruck = null;
      this.phase = 'open';
      return;
    }

    // Player can add to ruck with right stick up
    const ry = getRY();
    if (ry < -0.5 && !this._ruckJustAdded) {
      const nearest = this.getNearestPlayerTo(this.ruck.x, this.ruck.y, 0, true);
      if (nearest && nearest !== this.controlledPlayer) {
        const quality = Math.min(1, Math.abs(ry));
        if (quality > 0.85) {
          this.events.push({type:'penalty', msg:'Plongeon dans le ruck ! Pénalité.', dur:2});
          this.pendingPenalty = {side: 1, x: this.ruck.x, y: this.ruck.y, reason: 'Ruck plongeon'};
        } else {
          this.ruck.addPlayer(nearest, true);
        }
        this._ruckJustAdded = true;
        setTimeout(() => { this._ruckJustAdded = false; }, 500);
      }
    }

    this.ruck.update(dt);

    // CPU adds players to ruck
    if (Math.random() < dt * 0.5 && this.ruck.defensePlayers.length < 2) {
      const nearest = this.getNearestPlayerTo(this.ruck.x, this.ruck.y, 1, false);
      if (nearest && !nearest.inRuck && !nearest.onGround) {
        this.ruck.addPlayer(nearest, false);
      }
    }

    // Scrum half comes to collect if attack bar high enough
    if (this.ruck.attackBar > 0.7 && this.ruck.timeToPlay < 3) {
      const sh = this.getScrum9(this.ruck.possession);
      sh.x = this.ruck.x;
      sh.y = this.ruck.y + (this.ruck.possession === 0 ? -15 : 15);
    }

    // D-pad shortcuts in ruck
    this.handleDpad();
    this.updateCPU(dt);
  }

  updateScrum(dt) {
    if (!this.scrum) { this.phase = 'open'; return; }
    this.scrum.update(dt);
    if (this.scrum.phase === 'done') {
      if (this.scrum.penalized >= 0) {
        this.pendingPenalty = {side: 1 - this.scrum.penalized, x: this.scrum.x, y: this.scrum.y, reason: 'Mêlée'};
        this.triggerPenaltyChoice();
      } else if (this.scrum.settled) {
        // Ball comes out from scrum
        const sh = this.getScrum9(this.scrum.possession_winner);
        sh.hasBall = true;
        this.ball.carrier = sh;
        this.ball.team = this.scrum.possession_winner;
        if (this.scrum.possession_winner === 0) this.controlledPlayer = sh;
        this.phase = 'open';
      }
      this.scrum = null;
    }
  }

  updateLineout(dt) {
    if (!this.lineout) { this.phase = 'open'; return; }
    this.lineout.update(dt);
    if (this.lineout.phase === 'done' || this.lineout.phase === 'done_fail') {
      if (this.lineout.success) {
        // Ball won by throwing team
        const sh = this.getScrum9(this.lineout.possession);
        sh.hasBall = true;
        this.ball.carrier = sh;
        this.ball.team = this.lineout.possession;
        if (this.lineout.possession === 0) {
          this.controlledPlayer = sh;
        }
      } else {
        // Turnover or scrum
        this.startScrum(this.lineout.x, this.lineout.y, 1 - this.lineout.possession);
        this.lineout = null;
        return;
      }
      this.lineout = null;
      this.phase = 'open';
    }
  }

  updatePenaltyChoice(dt) {
    const pc = this.pendingPenaltyChoice;
    if (!pc) { this.phase = 'open'; return; }
    if (dUp()) pc.selected = (pc.selected - 1 + 4) % 4;
    if (dDown()) pc.selected = (pc.selected + 1) % 4;
    if (btnAP()) {
      this.executePenaltyChoice(pc);
    }
  }

  updatePenaltyKick(dt) {
    if (!this.penaltyKick) { this.phase = 'open'; return; }
    this.penaltyKick.update(dt);
    if (this.penaltyKick.phase === 'done') {
      this.penaltyKick = null;
      this.phase = 'open';
    }
  }

  triggerPenaltyChoice() {
    if (!this.pendingPenalty || this.pendingPenalty.side !== 0) {
      // CPU gets penalty - cpu decides automatically
      this.cpuPenaltyDecision();
      return;
    }
    this.pendingPenaltyChoice = {
      selected: 0,
      x: this.pendingPenalty.x,
      y: this.pendingPenalty.y,
      reason: this.pendingPenalty.reason,
      side: this.pendingPenalty.side
    };
    this.phase = 'penaltyChoice';
  }

  executePenaltyChoice(pc) {
    switch(pc.selected) {
      case 0: // Play quick
        this.phase = 'open';
        // Opponents back 10m
        this.pushTeamBack(1, pc.x);
        break;
      case 1: // Goal kick
        this.penaltyKick = new PenaltyKick(pc.x, pc.y, 0, 'penalty', this);
        this.phase = 'penaltyKick';
        break;
      case 2: // Scrum
        this.startScrum(pc.x, pc.y, 0);
        break;
      case 3: // Penalty touch (tap kick)
        this.kickState = new KickState(this.controlledPlayer, 'clearance');
        this.phase = 'open';
        break;
    }
    this.pendingPenalty = null;
    this.pendingPenaltyChoice = null;
  }

  cpuPenaltyDecision() {
    // CPU logic: kick goal if in range, else play
    const p = this.pendingPenalty;
    if (!p) return;
    const postX = X_TRY_L; // CPU attacks toward left
    const dist = Math.sqrt((p.x - postX)**2 + (p.y - Y_MID)**2) / SCALE;
    if (dist < 45) {
      // Try to kick
      this.events.push({type:'penalty', msg:'L\'adversaire tente le tir !', dur:2});
      setTimeout(() => {
        const success = Math.random() < (0.75 - dist/100);
        if (success) {
          this.score[1] += 3;
          this.events.push({type:'goal', msg:'Pénalité ! 3 pts adversaire', dur:3});
        } else {
          this.events.push({type:'miss', msg:'Raté !', dur:2});
        }
        this.setupAfterScore(false);
      }, 2000);
    } else {
      this.phase = 'open';
      this.pushTeamBack(0, p.x);
    }
    this.pendingPenalty = null;
  }

  penaltyKickDone(success, type, team) {
    if (success) {
      const pts = type === 'penalty' ? 3 : 2;
      this.score[team] += pts;
      this.events.push({type:'goal', msg: type === 'penalty' ? `PÉNALITÉ ! +3 pts` : `TRANSFORMATION ! +2 pts`, dur:3});
    }
    this.setupAfterScore(success);
  }

  setupAfterScore(scored) {
    // Renvoi depuis mi-terrain (engagement)
    setTimeout(() => {
      this.setupKickoff();
      // Other team kicks off after score
    }, 1500);
  }

  startRuck(carrier, tackler) {
    this.ruck = new Ruck(carrier, tackler, carrier.x, carrier.y);
    this.phase = 'ruck';
    carrier.inRuck = true;
    tackler.inRuck = true;
    // Nearest player becomes controlled
    this.switchToNearestPlayer(carrier);
  }

  startScrum(x, y, possession) {
    this.scrum = new Scrum(x, y, possession, this);
    this.phase = 'scrum';
  }

  startLineout(x, y, possession) {
    this.lineout = new Lineout(x, y, possession, this);
    this.phase = 'lineout';
  }

  checkTouch() {
    if (this.ball.inTouch) {
      const bx = this.ball.x, by = this.ball.touchY || this.ball.y;
      const possession = 1 - (this.ball.team === 0 ? 0 : 1); // lineout to other team
      this.ball.inTouch = false;
      this.ball.vx = this.ball.vy = 0;
      this.ball.loose = false;
      // Apply 50-22 rule
      let lineoutTeam = possession;
      if (this.lastKickPos && this.lastKickType !== 'grubber') {
        const kickerTeam = this.lastKickPos.team;
        const kickerX = this.lastKickPos.x;
        if (kickerTeam === 0 && kickerX < X_22L && bx > X_22R) {
          // 50-22: kicked from own 22, lands in opponent 22
          lineoutTeam = 0;
          this.events.push({type:'50-22', msg:'50-22 ! Touche pour vous !', dur:3});
        }
      }
      this.lastKickPos = null;
      this.events.push({type:'touch', msg:'EN TOUCHE !', dur:2});
      // Direct touch from outside 22 = lineout at kick spot
      setTimeout(() => {
        this.startLineout(Math.max(X_TRY_L, Math.min(X_TRY_R, bx)), by, lineoutTeam);
      }, 1000);
    }
  }

  checkTry() {
    const carrier = this.getBallCarrier();
    if (!carrier) return;
    const inGoalLeft  = carrier.x < X_TRY_L && carrier.x > FX;
    const inGoalRight = carrier.x > X_TRY_R && carrier.x < FX + FW;
    const tryForTeam0 = inGoalRight && carrier.teamIdx === 0;
    const tryForTeam1 = inGoalLeft  && carrier.teamIdx === 1;

    if (tryForTeam0 || tryForTeam1) {
      // Aplatir action
      const pAplatr = btnAP() || INPUT.kb['Enter'];
      if (pAplatr || carrier.teamIdx === 1) { // CPU auto-tries
        const team = carrier.teamIdx;
        carrier.hasBall = false;
        this.ball.carrier = null;
        this.score[team] += 5;
        this.events.push({type:'try', msg:'ESSAI !!! +5 pts', dur:4});
        // Conversion kick
        setTimeout(() => {
          if (team === 0) {
            this.penaltyKick = new PenaltyKick(carrier.x, carrier.y, team, 'conversion', this);
            this.phase = 'penaltyKick';
          } else {
            // CPU conversion
            const success = Math.random() < 0.7;
            if (success) {
              this.score[1] += 2;
              this.events.push({type:'goal', msg:'Transformation ! +2', dur:3});
            }
            this.setupAfterScore(true);
          }
        }, 2500);
      }
    }
  }

  handleDpad() {
    if (dUp()) {
      const now = Date.now();
      if (now - this.dUpLastTime < 400) this.dUpCount++;
      else this.dUpCount = 1;
      this.dUpLastTime = now;
      if (this.dUpCount >= 2) {
        // Rush defense
        this.rushDefenseActivate();
        this.dUpCount = 0;
      } else {
        // 3/4 line advance
        this.advance34Line();
      }
    }
    if (dDown()) {
      // Kicker reposition
    }
    if (dLeft()) {
      this.defenseSpacing = Math.max(1, this.defenseSpacing - 1);
      this.events.push({type:'tactical', msg:'Ligne resserrée', dur:1});
    }
    if (dRight()) {
      this.defenseSpacing = Math.min(5, this.defenseSpacing + 1);
      this.events.push({type:'tactical', msg:'Ligne élargie', dur:1});
    }
  }

  rushDefenseActivate() {
    // All defenders rush up
    for (let p of this.team1) {
      if (!p.onGround && !p.inRuck && !p.hasBall) {
        p.vx += (this.team2BallX() - p.x) > 0 ? 200 : 0;
      }
    }
    this.events.push({type:'tactical', msg:'RUSH DÉFENSE !', dur:1.5});
  }

  advance34Line() {
    // Wings and centers advance
    const backs = [this.team1[10], this.team1[11], this.team1[12], this.team1[13], this.team1[14]];
    for (let b of backs) {
      if (!b.onGround && !b.inRuck) {
        b.vx += 80;
      }
    }
    this.events.push({type:'tactical', msg:'3/4 en avant !', dur:1});
  }

  team2BallX() {
    const carrier = this.team2.find(p => p.hasBall);
    return carrier ? carrier.x : X_MID;
  }

  switchToNearestPlayer(avoidPlayer) {
    let nearest = null, minD = Infinity;
    for (let p of this.team1) {
      if (p === avoidPlayer || p.onGround || p.inRuck) continue;
      const d = p.distPt(this.ball.x, this.ball.y);
      if (d < minD) { minD = d; nearest = p; }
    }
    if (nearest) this.controlledPlayer = nearest;
  }

  getNearestPlayerTo(x, y, teamIdx, skipControlled) {
    const team = teamIdx === 0 ? this.team1 : this.team2;
    let nearest = null, minD = Infinity;
    for (let p of team) {
      if (p.onGround || p.inRuck) continue;
      if (skipControlled && p === this.controlledPlayer) continue;
      const d = p.distPt(x, y);
      if (d < minD) { minD = d; nearest = p; }
    }
    return nearest;
  }

  autoChase() {
    if (!this.ball.loose) return;
    // Both teams chase
    const nearest0 = this.getNearestPlayerTo(this.ball.x, this.ball.y, 0, false);
    const nearest1 = this.getNearestPlayerTo(this.ball.x, this.ball.y, 1, false);
    const target = (x, y) => ({ x: this.ball.x - x, y: this.ball.y - y });

    if (nearest0 && !nearest0.hasBall) {
      const t = target(nearest0.x, nearest0.y);
      const d = Math.sqrt(t.x*t.x + t.y*t.y);
      if (d > 5) {
        nearest0.vx = t.x / d * nearest0.maxSpeed() * 0.9;
        nearest0.vy = t.y / d * nearest0.maxSpeed() * 0.9;
      }
      if (d < nearest0.profile.r + 10) {
        nearest0.hasBall = true;
        this.ball.carrier = nearest0;
        this.ball.loose = false;
        this.ball.team = 0;
        this.controlledPlayer = nearest0;
      }
    }
    if (nearest1 && !nearest1.hasBall) {
      const t = target(nearest1.x, nearest1.y);
      const d = Math.sqrt(t.x*t.x + t.y*t.y);
      if (d > 5) {
        nearest1.vx = t.x / d * nearest1.maxSpeed() * 0.9;
        nearest1.vy = t.y / d * nearest1.maxSpeed() * 0.9;
      }
      if (d < nearest1.profile.r + 10) {
        nearest1.hasBall = true;
        this.ball.carrier = nearest1;
        this.ball.loose = false;
        this.ball.team = 1;
      }
    }
  }

  pushTeamBack(teamIdx, penaltyX) {
    const team = teamIdx === 0 ? this.team1 : this.team2;
    const dir = teamIdx === 0 ? -1 : 1;
    for (let p of team) {
      p.x += dir * 10 * SCALE; // 10m back
    }
  }

  stamina_drain(p, amount) {
    p.stamina = Math.max(0, p.stamina - amount);
  }

  // ============================================================
  // CPU AI
  // ============================================================
  updateCPU(dt) {
    const carrier = this.team2.find(p => p.hasBall);
    const ball = this.ball;

    if (carrier) {
      // CPU has ball - attack
      this.cpuAttack(carrier, dt);
    } else if (ball.team === 0 || (ball.loose && !ball.carrier)) {
      // CPU defends
      this.cpuDefend(dt);
    }
  }

  cpuAttack(carrier, dt) {
    const targetX = X_TRY_L; // CPU attacks left
    const dx = targetX - carrier.x;
    const dy = Y_MID - carrier.y;
    const d = Math.sqrt(dx*dx + dy*dy);

    // Run toward try line (but seek intervals)
    const myTeam = this.team1;
    let bestGap = {x: targetX, y: carrier.y};
    let minDefDist = Infinity;

    // Find gap between defenders
    for (let def of myTeam) {
      if (def.onGround || def.inRuck) continue;
      const defDist = def.distPt(targetX, carrier.y);
      if (defDist < minDefDist) {
        minDefDist = defDist;
        // Find gap to run into
        const gap = this.findGap(carrier, myTeam);
        bestGap = gap;
      }
    }

    const gx = bestGap.x - carrier.x;
    const gy = bestGap.y - carrier.y;
    const gm = Math.sqrt(gx*gx + gy*gy);
    if (gm > 10) {
      carrier.vx = gx/gm * carrier.maxSpeed();
      carrier.vy = gy/gm * carrier.maxSpeed();
    }

    // CPU charge when running toward defenders
    carrier.chargeGauge = Math.min(0.75, carrier.chargeGauge + dt * 0.3);

    // Pass to support when needed
    const nearDef = myTeam.find(def => !def.onGround && carrier.dist(def) < 30);
    if (nearDef && Math.random() < dt * 0.8) {
      this.cpuPass(carrier);
    }

    // CPU kick when in own half and under pressure
    const pressure = myTeam.filter(def => !def.onGround && carrier.dist(def) < 60).length;
    if (pressure >= 2 && carrier.x > X_MID && Math.random() < dt * 0.3) {
      this.cpuKick(carrier);
    }

    // Support players spread diagonally
    this.spreadCPUAttack(carrier);
  }

  findGap(carrier, defenders) {
    const fy = carrier.y;
    let bestGap = { x: carrier.teamIdx === 1 ? carrier.x - 40 : carrier.x + 40, y: fy, score: 0 };
    // Check multiple y positions for gaps
    for (let ty = FY + 20; ty < FY + FH - 20; ty += 20) {
      let minDefDist = Infinity;
      for (let def of defenders) {
        if (def.onGround || def.inRuck) continue;
        const d = Math.sqrt((def.x - (carrier.x - 40))**2 + (def.y - ty)**2);
        if (d < minDefDist) minDefDist = d;
      }
      if (minDefDist > bestGap.score) {
        bestGap = { x: carrier.x - 40, y: ty, score: minDefDist };
      }
    }
    return bestGap;
  }

  cpuPass(carrier) {
    const teammates = this.team2.filter(p => p !== carrier && !p.onGround && !p.inRuck);
    const nearest = teammates.sort((a,b) => carrier.dist(a) - carrier.dist(b))[0];
    if (!nearest) return;
    // Check backward
    const isBackward = (carrier.teamIdx === 1 && nearest.x > carrier.x);
    if (!isBackward) return; // Only pass backward
    carrier.hasBall = false;
    this.ball.carrier = null;
    const dx = nearest.x - carrier.x, dy = nearest.y - carrier.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    this.ball.vx = dx/d * 280 + carrier.vx * 0.3;
    this.ball.vy = dy/d * 280 + carrier.vy * 0.3;
    this.ball.vz = 25;
    this.ball.onGround = false;
    this.ball.team = 1;
    const spd = 280, travelTime = d/spd;
    const tgt = nearest;
    setTimeout(() => {
      if (tgt && !tgt.onGround) {
        tgt.hasBall = true;
        this.ball.carrier = tgt;
        this.ball.loose = false;
        this.ball.team = 1;
      }
    }, travelTime * 800);
  }

  cpuKick(carrier) {
    if (this.ball.carrier !== carrier) return;
    carrier.hasBall = false;
    this.ball.carrier = null;
    const targetX = FX + FW - 80; // kick deep into player's half
    const dx = targetX - carrier.x, dy = Y_MID - carrier.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    this.ball.vx = dx/d * 250;
    this.ball.vy = dy/d * 250;
    this.ball.vz = 120 + Math.random() * 60;
    this.ball.onGround = false;
    this.ball.loose = true;
    this.ball.team = -1;
    this.lastKickPos = { x: carrier.x, y: carrier.y, team: 1 };
    this.events.push({type:'kick', msg:'Dégagement CPU', dur:1.5});
    // Switch player control to nearest to receive
    const fb = this.team1[14];
    this.controlledPlayer = fb;
  }

  cpuDefend(dt) {
    const ball = this.ball;
    const carrier = this.getBallCarrier() || { x: ball.x, y: ball.y, teamIdx: 0 };

    // Organize defense line
    const lineX = carrier.x + (carrier.teamIdx === 0 ? -30 : 30);

    for (let def of this.team2) {
      if (def.onGround || def.inRuck || def.hasBall) continue;

      // Nearest defender rushes carrier
      const dist = def.distPt(carrier.x, carrier.y);
      if (dist < 200) {
        // Move toward ball carrier
        const dx = carrier.x - def.x, dy = carrier.y - def.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d > def.profile.r + 5) {
          def.vx = dx/d * def.maxSpeed() * 0.8;
          def.vy = dy/d * def.maxSpeed() * 0.8;
        }
        // Set tackle gauge
        if (d < 80) {
          def.tackleGauge = Math.min(0.8, def.tackleGauge + dt * 0.5);
          def.tackleType = ['legs','waist','arms'][Math.floor(Math.random()*3)];
        }
      } else {
        // Hold line
        const targetX = lineX + (def.posIdx < 8 ? (def.posIdx - 4) * 12 : 0);
        const targetY = FY + FH * (def.posIdx / 15);
        const dx = targetX - def.x, dy = targetY - def.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d > 15) {
          def.vx = dx/d * def.maxSpeed() * 0.4;
          def.vy = dy/d * def.maxSpeed() * 0.4;
        }
      }
    }

    // Check CPU tackle collision
    if (carrier && carrier.teamIdx === 0 && carrier.hasBall) {
      for (let def of this.team2) {
        if (def.onGround || def.inRuck || def.stunTime > 0) continue;
        const d = carrier.dist(def);
        if (d < def.profile.r + carrier.profile.r + 4 && !this.tackleBlock) {
          const tg = Math.min(0.8, def.tackleGauge || 0.4 + Math.random() * 0.3);
          const tType = def.tackleType || 'waist';
          this.tackleBlock = new TackleBlock(carrier, def, tType, this.chargeState.gauge, tg);
          this.chargeState = { active: false, gauge: 0 };
          this.switchToNearestPlayer(carrier);
          break;
        }
      }
    }
  }

  spreadCPUAttack(carrier) {
    // 3/4 diagonal spread
    const backs = this.team2.filter((p,i) => i >= 9 && !p.onGround && !p.inRuck && !p.hasBall);
    const baseX = carrier.x + 30;
    backs.forEach((p, i) => {
      const targetX = baseX + i * 25;
      const targetY = FY + FH * 0.2 + i * (FH * 0.15);
      const dx = targetX - p.x, dy = targetY - p.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > 20) {
        p.vx = dx/d * p.maxSpeed() * 0.5;
        p.vy = dy/d * p.maxSpeed() * 0.5;
      }
    });
  }

  draw() {
    drawField();
    if (this.ruck) this.ruck.draw();
    if (this.scrum) this.scrum.draw();
    if (this.lineout) this.lineout.draw();
    // Players
    const t1 = this.team1Data, t2 = this.team2Data;
    for (let p of this.team2) {
      p.draw(t2.c1, t2.c2, t2.c3, t2.style);
    }
    for (let p of this.team1) {
      p.isSelected = (p === this.controlledPlayer);
      p.draw(t1.c1, t1.c2, t1.c3, t1.style);
    }
    // Ball
    this.ball.draw();
    // Kick state overlay
    if (this.kickState) this.kickState.draw();
    if (this.penaltyKick) this.penaltyKick.draw();
    // Referee
    drawReferee(this);
    // HUD
    drawHUD(this);
    // Penalty choice
    drawPenaltyChoice(this);

    // Pass charge visual (ball in front of carrier)
    if (this.passState.active) {
      const carrier = this.getBallCarrier();
      if (carrier) {
        const offset = this.passState.dir * this.passState.gauge * 20;
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = gaugeColor(this.passState.gauge);
        ctx.beginPath();
        ctx.ellipse(carrier.x + offset, carrier.y, 6, 4, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Fulltime screen
    if (this.phase === 'fulltime') {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('COUP DE SIFFLET FINAL', W/2, H/2 - 60);
      ctx.font = 'bold 36px Arial';
      ctx.fillStyle = '#fff';
      ctx.fillText(`${this.team1Data.name || 'Équipe 1'}  ${this.score[0]} - ${this.score[1]}  ${this.team2Data.name || 'Équipe 2'}`, W/2, H/2);
      const winner = this.score[0] > this.score[1] ? (this.team1Data.name || 'Équipe 1') :
                      this.score[1] > this.score[0] ? (this.team2Data.name || 'Équipe 2') : 'Égalité !';
      ctx.fillStyle = '#00FF44';
      ctx.font = 'bold 28px Arial';
      ctx.fillText(this.score[0] !== this.score[1] ? winner + ' gagne !' : 'Match nul !', W/2, H/2 + 50);
      ctx.fillStyle = '#888';
      ctx.font = '16px Arial';
      ctx.fillText('[Start] Retour au menu', W/2, H/2 + 100);
      if (btnStart()) GAME.state = 'menu';
    }
  }
}
// ============================================================
// MENU SYSTEM
// ============================================================
const MENU = {
  state: 'main',  // main, continent, league, teamSelect, management, toss
  cursor: 0,
  teamCursor: 0,
  selectedTeam1: null,
  selectedTeam2: null,
  choosingFor: 1,  // 1 = player team, 2 = CPU team
  continentList: [],
  teamList: [],
  currentContinent: null,
  currentLeague: null,
  managementCursor: 0,
  managementTeam: null,
  managementPlayers: [],
  tossPick: 0,      // 0=kickoff, 1=receive
  prevDUp: false, prevDDown: false, prevDLeft: false, prevDRight: false,
  prevA: false, prevB: false,

  init() {
    this.state = 'main';
    this.cursor = 0;
    this.teamCursor = 0;
    this.selectedTeam1 = null;
    this.selectedTeam2 = null;
    this.continentList = Object.keys(TEAM_DB);
    this.choosingFor = 1;
  },

  update(dt) {
    INPUT.poll();
    const up    = dUp();
    const down  = dDown();
    const left  = dLeft();
    const right = dRight();
    const aP    = btnAP();
    const bP    = btnBP();
    // Keyboard fallback
    const kbUp    = (INPUT.kb['ArrowUp']    && !INPUT._prevKb?.['ArrowUp']);
    const kbDown  = (INPUT.kb['ArrowDown']  && !INPUT._prevKb?.['ArrowDown']);
    const kbLeft  = (INPUT.kb['ArrowLeft']  && !INPUT._prevKb?.['ArrowLeft']);
    const kbRight = (INPUT.kb['ArrowRight'] && !INPUT._prevKb?.['ArrowRight']);
    const kbEnter = (INPUT.kb['Enter']      && !INPUT._prevKb?.['Enter']);
    const kbEsc   = (INPUT.kb['Escape']     && !INPUT._prevKb?.['Escape']);
    INPUT._prevKb = {...INPUT.kb};

    const goUp    = up    || kbUp;
    const goDown  = down  || kbDown;
    const goLeft  = left  || kbLeft;
    const goRight = right || kbRight;
    const goA     = aP   || kbEnter;
    const goB     = bP   || kbEsc;

    switch(this.state) {
      case 'main': {
        const opts = ['Match', 'Quitter'];
        if (goUp   ) this.cursor = (this.cursor - 1 + opts.length) % opts.length;
        if (goDown ) this.cursor = (this.cursor + 1) % opts.length;
        if (goA) {
          if (this.cursor === 0) { this.state = 'continent'; this.cursor = 0; this.choosingFor = 1; }
          if (this.cursor === 1) { window.close(); }
        }
        break;
      }
      case 'continent': {
        if (goUp  ) this.cursor = (this.cursor - 1 + this.continentList.length) % this.continentList.length;
        if (goDown) this.cursor = (this.cursor + 1) % this.continentList.length;
        if (goA) {
          this.currentContinent = this.continentList[this.cursor];
          const leagues = Object.keys(TEAM_DB[this.currentContinent]);
          if (leagues.length === 1 && typeof TEAM_DB[this.currentContinent][leagues[0]] === 'object' && 'c1' in TEAM_DB[this.currentContinent][leagues[0]]) {
            // Direct team list (like RÉTRO, SPECIAL)
            this.teamList = Object.keys(TEAM_DB[this.currentContinent]).map(name => ({
              name, data: TEAM_DB[this.currentContinent][name]
            }));
            this.state = 'teamSelect';
          } else {
            // Has leagues
            this.state = 'league';
          }
          this.cursor = 0;
        }
        if (goB) { this.state = 'main'; this.cursor = 0; }
        break;
      }
      case 'league': {
        const leagues = Object.keys(TEAM_DB[this.currentContinent]);
        if (goUp  ) this.cursor = (this.cursor - 1 + leagues.length) % leagues.length;
        if (goDown) this.cursor = (this.cursor + 1) % leagues.length;
        if (goA) {
          this.currentLeague = leagues[this.cursor];
          const leagueData = TEAM_DB[this.currentContinent][this.currentLeague];
          if (leagueData.c1) {
            // Directly a team
            this.selectTeam(this.currentLeague, leagueData);
          } else {
            this.teamList = Object.keys(leagueData).map(name => ({
              name, data: leagueData[name]
            }));
            this.state = 'teamSelect';
          }
          this.cursor = 0;
        }
        if (goB) { this.state = 'continent'; this.cursor = 0; }
        break;
      }
      case 'teamSelect': {
        if (goUp  ) this.cursor = (this.cursor - 1 + this.teamList.length) % this.teamList.length;
        if (goDown) this.cursor = (this.cursor + 1) % this.teamList.length;
        if (goA) {
          const team = this.teamList[this.cursor];
          this.selectTeam(team.name, team.data);
        }
        if (goB) { this.state = 'league'; this.cursor = 0; }
        break;
      }
      case 'management': {
        const opts = this.managementPlayers;
        if (goUp   ) this.managementCursor = (this.managementCursor - 1 + opts.length) % opts.length;
        if (goDown ) this.managementCursor = (this.managementCursor + 1) % opts.length;
        if (goA) {
          // Confirm lineup and go to toss
          this.state = 'toss';
          this.cursor = 0;
          this.tossPick = 0;
        }
        if (goB) { this.state = 'continent'; this.cursor = 0; }
        break;
      }
      case 'toss': {
        if (goLeft || goRight) this.tossPick = 1 - this.tossPick;
        if (goUp || goDown) this.tossPick = 1 - this.tossPick;
        if (goA) {
          // Start match
          this.startMatch();
        }
        break;
      }
    }
  },

  selectTeam(name, data) {
    const teamObj = {...data, name};
    if (this.choosingFor === 1) {
      this.selectedTeam1 = teamObj;
      this.managementPlayers = [...(data.players || [])];
      this.managementTeam = teamObj;
      this.state = 'management';
      this.managementCursor = 0;
      this.choosingFor = 2;
    } else {
      this.selectedTeam2 = teamObj;
      // Auto-pick CPU lineup
      this.startMatch();
    }
  },

  startMatch() {
    if (!this.selectedTeam1 || !this.selectedTeam2) return;
    const t1 = this.selectedTeam1;
    const t2 = this.selectedTeam2;
    const t1players = (t1.players || []).slice(0, 15);
    const t2players = (t2.players || []).slice(0, 15);
    // Fill to 15 if needed
    while (t1players.length < 15) t1players.push(genPlayer(70, t1players.length));
    while (t2players.length < 15) t2players.push(genPlayer(70, t2players.length));
    match = new Match(t1, t2, t1players, t2players);
    GAME.state = 'match';
  },

  draw() {
    // Animated background
    ctx.fillStyle = '#0a1a0a';
    ctx.fillRect(0, 0, W, H);
    // Field outline in background
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.strokeRect(FX, FY, FW, FH);

    // Title
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 42px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 8;
    ctx.fillText('RUGBY XV', W/2, 70);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#aaa';
    ctx.font = '14px Arial';
    ctx.fillText('LE JEU COMPLET', W/2, 92);

    switch(this.state) {
      case 'main': this.drawMain(); break;
      case 'continent': this.drawList('Choisir Continent / Catégorie', this.continentList); break;
      case 'league': {
        const leagues = Object.keys(TEAM_DB[this.currentContinent]);
        this.drawList('Choisir Ligue / Groupe - ' + this.currentContinent, leagues);
        break;
      }
      case 'teamSelect': this.drawTeamSelect(); break;
      case 'management': this.drawManagement(); break;
      case 'toss': this.drawToss(); break;
    }

    // Controller hint
    ctx.fillStyle = '#444';
    ctx.font = '10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Manette Xbox | D-pad: Naviguer  [A]: Confirmer  [B]: Retour  —  ou Clavier: Flèches + Entrée + Echap', W/2, H - 12);
  },

  drawMain() {
    const opts = ['⚽ Match', '✖ Quitter'];
    const bw = 260, bh = 54;
    opts.forEach((o, i) => {
      const bx = W/2 - bw/2, by = H/2 - 40 + i * 70;
      const selected = i === this.cursor;
      ctx.fillStyle = selected ? 'rgba(255,215,0,0.2)' : 'rgba(0,0,0,0.5)';
      roundRect(bx, by, bw, bh, 10); ctx.fill();
      ctx.strokeStyle = selected ? '#FFD700' : '#444';
      ctx.lineWidth = selected ? 2.5 : 1.5;
      roundRect(bx, by, bw, bh, 10); ctx.stroke();
      ctx.fillStyle = selected ? '#FFD700' : '#CCCCCC';
      ctx.font = (selected ? 'bold ' : '') + '20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(o, W/2, by + 32);
    });
  },

  drawList(title, items) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(title, W/2, 130);

    const visible = 12;
    const start = Math.max(0, this.cursor - Math.floor(visible/2));
    const end = Math.min(items.length, start + visible);
    const bw = 380, bx = W/2 - bw/2;

    for (let i = start; i < end; i++) {
      const sel = i === this.cursor;
      const by = 155 + (i - start) * 40;
      ctx.fillStyle = sel ? 'rgba(255,215,0,0.18)' : 'rgba(0,0,0,0.4)';
      roundRect(bx, by, bw, 34, 6); ctx.fill();
      ctx.strokeStyle = sel ? '#FFD700' : '#333';
      ctx.lineWidth = sel ? 2 : 1;
      roundRect(bx, by, bw, 34, 6); ctx.stroke();
      ctx.fillStyle = sel ? '#FFD700' : '#CCCCCC';
      ctx.font = (sel ? 'bold ' : '') + '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText((sel ? '▶ ' : '  ') + items[i], W/2, by + 22);
    }
    ctx.fillStyle = '#666';
    ctx.font = '11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`${this.cursor + 1} / ${items.length}`, W/2, H - 35);
  },

  drawTeamSelect() {
    const title = this.choosingFor === 1 ? 'VOTRE ÉQUIPE' : 'ÉQUIPE CPU';
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`Choisir ${title} - ${this.currentLeague || this.currentContinent}`, W/2, 130);

    const visible = 11;
    const start = Math.max(0, this.cursor - Math.floor(visible/2));
    const end = Math.min(this.teamList.length, start + visible);
    const bw = 450, bx = W/2 - bw/2;

    for (let i = start; i < end; i++) {
      const sel = i === this.cursor;
      const by = 155 + (i - start) * 44;
      const team = this.teamList[i];
      ctx.fillStyle = sel ? 'rgba(255,215,0,0.15)' : 'rgba(0,0,0,0.45)';
      roundRect(bx, by, bw, 38, 6); ctx.fill();
      // Team color swatch
      ctx.fillStyle = team.data.c1 || '#888';
      ctx.fillRect(bx + 8, by + 8, 18, 22);
      if (team.data.c2) {
        ctx.fillStyle = team.data.c2;
        ctx.fillRect(bx + 18, by + 8, 8, 22);
      }
      ctx.strokeStyle = sel ? '#FFD700' : '#333';
      ctx.lineWidth = sel ? 2 : 1;
      roundRect(bx, by, bw, 38, 6); ctx.stroke();
      ctx.fillStyle = sel ? '#FFD700' : '#CCCCCC';
      ctx.font = (sel ? 'bold ' : '') + '13px Arial';
      ctx.textAlign = 'left';
      ctx.fillText((sel ? '▶ ' : '  ') + team.name, bx + 36, by + 24);
      // Rating average
      const avgRating = team.data.players ? Math.round(team.data.players.slice(0,15).reduce((s,p)=>s+(p.r||70),0)/15) : 70;
      ctx.fillStyle = '#888';
      ctx.font = '11px Arial';
      ctx.textAlign = 'right';
      ctx.fillText(`Note: ${avgRating}`, bx + bw - 10, by + 24);
    }
  },

  drawManagement() {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GESTION D\'ÉQUIPE - ' + (this.managementTeam?.name || ''), W/2, 120);
    ctx.fillStyle = '#aaa';
    ctx.font = '11px Arial';
    ctx.fillText('[A] Confirmer et continuer  |  Composition actuelle:', W/2, 138);

    const bw = 600, bx = W/2 - bw/2;
    const rows = Math.min(15, this.managementPlayers.length);
    for (let i = 0; i < rows; i++) {
      const p = this.managementPlayers[i];
      if (!p) continue;
      const by = 150 + i * 34;
      const sel = i === this.managementCursor;
      ctx.fillStyle = sel ? 'rgba(255,215,0,0.12)' : (i % 2 === 0 ? 'rgba(0,0,0,0.4)' : 'rgba(30,30,30,0.4)');
      ctx.fillRect(bx, by, bw, 30);
      ctx.fillStyle = sel ? '#FFD700' : '#ccc';
      ctx.font = (sel ? 'bold ' : '') + '11px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(`${i+1}. ${PROFILES[i]?.pos || 'Joueur'}`, bx + 10, by + 20);
      ctx.textAlign = 'center';
      ctx.fillText(p.n, bx + bw/2, by + 20);
      // Rating bar
      const rw = 80;
      ctx.fillStyle = '#333';
      ctx.fillRect(bx + bw - rw - 60, by + 8, rw, 12);
      ctx.fillStyle = p.r >= 85 ? '#FFD700' : p.r >= 75 ? '#00CC44' : '#FF8C00';
      ctx.fillRect(bx + bw - rw - 60, by + 8, rw * (p.r/100), 12);
      ctx.fillStyle = '#fff';
      ctx.font = '10px Arial';
      ctx.textAlign = 'right';
      ctx.fillText(p.r, bx + bw - 8, by + 20);
    }
  },

  drawToss() {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('TIRAGE AU SORT', W/2, 150);
    ctx.fillStyle = '#888';
    ctx.font = '13px Arial';
    ctx.fillText('Le capitaine adverse lance la pièce... et vous la rattrapez !', W/2, 185);

    // Coin flip animation
    const coinX = W/2, coinY = H/2 - 50;
    const t = Date.now() / 1000;
    const coinW = 40 + Math.abs(Math.sin(t * 3)) * 20;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.ellipse(coinX, coinY, coinW, 40, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#c8860a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#c8860a';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(Math.sin(t*3) > 0 ? '⚽' : '🏉', coinX, coinY + 7);

    // Options
    const opts = ['Engager (donner coup de pied)', 'Recevoir (laisser adversaire engager)'];
    opts.forEach((o, i) => {
      const sel = i === this.tossPick;
      const bw = 380, bx = W/2 - bw/2, by = H/2 + 30 + i * 65;
      ctx.fillStyle = sel ? 'rgba(255,215,0,0.2)' : 'rgba(0,0,0,0.5)';
      roundRect(bx, by, bw, 52, 8); ctx.fill();
      ctx.strokeStyle = sel ? '#FFD700' : '#555';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      roundRect(bx, by, bw, 52, 8); ctx.stroke();
      ctx.fillStyle = sel ? '#FFD700' : '#AAAAAA';
      ctx.font = (sel ? 'bold ' : '') + '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText((sel ? '▶ ' : '') + o, W/2, by + 30);
    });
    ctx.fillStyle = '#888';
    ctx.font = '11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('[D-pad ↑↓] Choisir  [A] Confirmer', W/2, H - 40);
  }
};

// ============================================================
// PAUSE MENU
// ============================================================
const PAUSE = {
  cursor: 0,
  opts: ['Reprendre', 'Gestion d\'équipe', 'Réglages', 'Quitter le match'],
  settings: {
    zoom5m: true,
    highlightSpaces: false,
    timeScale: 2,
    difficulty: 'Normal',
  },
  subState: null, // null, 'settings'

  draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, W, H);
    const bw = 320, bh = 300, bx = W/2 - bw/2, by = H/2 - bh/2;
    ctx.fillStyle = 'rgba(10,20,10,0.95)';
    roundRect(bx, by, bw, bh, 12); ctx.fill();
    ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2;
    roundRect(bx, by, bw, bh, 12); ctx.stroke();
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    ctx.fillText('PAUSE', W/2, by + 30);

    if (this.subState === 'settings') {
      this.drawSettings(bx, by, bw, bh);
      return;
    }
    this.opts.forEach((o, i) => {
      const sel = i === this.cursor;
      ctx.fillStyle = sel ? '#FFD700' : '#CCCCCC';
      ctx.font = (sel ? 'bold ' : '') + '15px Arial';
      ctx.textAlign = 'center';
      ctx.fillText((sel ? '▶ ' : '  ') + o, W/2, by + 70 + i * 48);
    });
    ctx.fillStyle = '#555'; ctx.font = '10px Arial';
    ctx.fillText('[D↑↓] Naviguer  [A] Confirmer', W/2, by + bh - 14);
  },

  drawSettings(bx, by, bw, bh) {
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
    ctx.fillText('RÉGLAGES', W/2, by + 55);
    const settings = [
      {label: 'Zoom dans les 5m', val: this.settings.zoom5m ? 'OUI' : 'NON'},
      {label: 'Highlight espaces libres', val: this.settings.highlightSpaces ? 'OUI' : 'NON'},
      {label: 'Difficulté', val: this.settings.difficulty},
    ];
    settings.forEach((s, i) => {
      const sel = i === this.cursor;
      ctx.fillStyle = sel ? '#FFD700' : '#aaa';
      ctx.font = (sel ? 'bold ' : '') + '13px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(`${sel?'▶':' '} ${s.label}:`, bx + 20, by + 90 + i * 40);
      ctx.textAlign = 'right';
      ctx.fillText(s.val, bx + bw - 20, by + 90 + i * 40);
    });
    ctx.fillStyle = '#555'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
    ctx.fillText('[B] Retour', W/2, by + bh - 14);
  },

  update() {
    INPUT.poll();
    const goUp   = dUp()   || (INPUT.kb['ArrowUp']   && !INPUT._prevKb?.['ArrowUp']);
    const goDown = dDown() || (INPUT.kb['ArrowDown']  && !INPUT._prevKb?.['ArrowDown']);
    const goA    = btnAP() || (INPUT.kb['Enter']      && !INPUT._prevKb?.['Enter']);
    const goB    = btnBP() || (INPUT.kb['Escape']     && !INPUT._prevKb?.['Escape']);
    INPUT._prevKb = {...INPUT.kb};

    if (this.subState === 'settings') {
      const settingKeys = ['zoom5m','highlightSpaces','difficulty'];
      if (goUp  ) this.cursor = (this.cursor - 1 + settingKeys.length) % settingKeys.length;
      if (goDown) this.cursor = (this.cursor + 1) % settingKeys.length;
      if (goA) {
        const k = settingKeys[this.cursor];
        if (typeof this.settings[k] === 'boolean') this.settings[k] = !this.settings[k];
        else if (k === 'difficulty') {
          const opts = ['Facile','Normal','Difficile','Légendaire'];
          const idx = opts.indexOf(this.settings.difficulty);
          this.settings.difficulty = opts[(idx+1)%opts.length];
        }
      }
      if (goB) { this.subState = null; this.cursor = 0; }
      return;
    }

    if (goUp  ) this.cursor = (this.cursor - 1 + this.opts.length) % this.opts.length;
    if (goDown) this.cursor = (this.cursor + 1) % this.opts.length;
    if (goA) {
      switch(this.cursor) {
        case 0: GAME.state = 'match'; match.paused = false; break;
        case 1: break; // team management
        case 2: this.subState = 'settings'; this.cursor = 0; break;
        case 3: GAME.state = 'menu'; MENU.init(); break;
      }
    }
    if (goB || btnStart()) { GAME.state = 'match'; match.paused = false; }
  }
};

// ============================================================
// GAME CONTROLLER
// ============================================================
const GAME = {
  state: 'menu', // menu, match, pause
};

let match = null;

// ============================================================
// MAIN GAME LOOP
// ============================================================
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  ctx.clearRect(0, 0, W, H);

  switch(GAME.state) {
    case 'menu':
      MENU.update(dt);
      MENU.draw();
      break;
    case 'match':
      if (match) {
        if (btnStart()) {
          GAME.state = 'pause';
          PAUSE.cursor = 0;
          PAUSE.subState = null;
        } else {
          match.update(dt);
        }
        match.draw();
      }
      break;
    case 'pause':
      if (match) match.draw(); // Draw match behind
      PAUSE.draw();
      PAUSE.update();
      break;
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT
// ============================================================
MENU.init();
requestAnimationFrame(gameLoop);

console.log('Rugby XV chargé ! Connectez une manette Xbox ou utilisez le clavier (WASD/Flèches + IJKL + Z/X/C/V)');
</script></body></html>
